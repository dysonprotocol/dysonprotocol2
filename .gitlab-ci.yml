# ============================================================================
# GitLab CI/CD Pipeline for dysonprotocol2
# ============================================================================
#
# Stages:
#   1. image  - Build CI image from Dockerfile.dev (Kaniko, no DinD)
#   2. lint   - Go vet, go mod tidy check
#   3. build  - DYSVM assets + dysond binary
#   4. test   - pytest suite (parallel by module)
#
# The CI image is built from the same Dockerfile.dev used for local dev and
# docker-compose, so CI and dev environments never drift.
#
# Releases are handled by GitHub Actions, not this pipeline.
# ============================================================================

stages:
  - image
  - lint
  - build
  - test

variables:
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:latest
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "1"
  GIT_SUBMODULE_DEPTH: "1"
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # Non-interactive defaults for DYSVM and verify-requirements
  VERIFY_REQS_YES: "1"
  DYSVM_YES: "1"
  CGO_ENABLED: "1"
  GOFLAGS: "-buildvcs=false"
  # Coverage packages (from Makefile)
  COVERAGE_PACKAGES: "dysonprotocol.com/x/crontask/keeper,dysonprotocol.com/x/nameservice/keeper,dysonprotocol.com/x/nft/keeper,dysonprotocol.com/x/script/keeper,dysonprotocol.com/x/storage/keeper,dysonprotocol.com/x/whaleswap/keeper,dysonprotocol.com/dysond/server/dwapp"

# ---------------------------------------------------------------------------
# Build CI image from Dockerfile.dev when it changes.
# Uses Kaniko -- no Docker socket or DinD needed.
# Set BUILD_CI_IMAGE=true to force a rebuild (e.g. after requirements.txt
# changes that aren't reflected in Dockerfile.dev itself).
# ---------------------------------------------------------------------------
build-ci-image:
  stage: image
  variables:
    GIT_SUBMODULE_STRATEGY: none
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - dyson
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/.devcontainer/Dockerfile.dev
      --destination $CI_IMAGE
      --insecure
  rules:
    - changes: [.devcontainer/Dockerfile.dev]
    - if: $BUILD_CI_IMAGE == "true"

# ---------------------------------------------------------------------------
# Default job settings
# ---------------------------------------------------------------------------
default:
  image: $CI_IMAGE
  tags:
    - dyson
  before_script:
    - go version
    - python3 --version

# ---------------------------------------------------------------------------
# Stage 2: Lint
# ---------------------------------------------------------------------------
go-vet:
  stage: lint
  variables:
    GIT_SUBMODULE_PATHS: "cosmos-sdk dysvm/go-embed-python"
  script:
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

go-mod-tidy:
  stage: lint
  variables:
    GIT_SUBMODULE_PATHS: "cosmos-sdk dysvm/go-embed-python"
  script:
    - go mod tidy
    - git diff --exit-code go.mod go.sum
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage 3: Build
# ---------------------------------------------------------------------------
build-dysond:
  stage: build
  script:
    - echo "Building DYSVM assets + dysond binary..."
    - make dysvm build
    - ./build/dysond version --long
  artifacts:
    paths:
      - build/dysond
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Stage 4: Test (parallel by module)
# ---------------------------------------------------------------------------
# make test builds dysond with -cover independently, then runs pytest.
# The build-dysond job gates this stage but test jobs rebuild their own
# coverage-instrumented binary.
# ---------------------------------------------------------------------------

.test-template:
  stage: test
  needs:
    - build-dysond
  script:
    - mkdir -p reports
    - make dev-install
    - ./.venv/bin/pip install pytest-html
    # Install Playwright browser (pytest.ini addopts includes --browser chromium)
    # Override --headed with --headless for CI.
    - ./.venv/bin/playwright install chromium --with-deps || true
    - |
      make test PYTEST_ARGS="${PYTEST_ARGS} --headless --html=reports/pytest.html --self-contained-html --junitxml=reports/pytest.xml"
  coverage: '/^TOTAL\s+\S+\s+\S+\s+(\d+\.\d+)%$/'
  artifacts:
    when: always
    paths:
      - reports/pytest.html
      - reports/pytest.xml
      - coverage.out
      - coverage.txt
      - coverage.html
    reports:
      junit: reports/pytest.xml
    expire_in: 14 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test-keeper:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/crontask/keeper tests/nameservice/keeper tests/nft/keeper tests/script/keeper tests/storage/keeper tests/whaleswap/keeper"

test-whaleswap:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/whaleswap/amm tests/whaleswap/auction tests/whaleswap/leverage tests/whaleswap/arbitrage tests/whaleswap/orderbook"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
      allow_failure: true

test-nameservice-bids:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/nameservice/bids"

test-dwapp:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/dysond/server/dwapp"

test-integration:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/chainnet.py tests/ante_implementation.py tests/crontask/subscriptions tests/nameservice tests/nft tests/script tests/storage tests/tew tests/tewl tests/upgrade tests/examples tests/x"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
