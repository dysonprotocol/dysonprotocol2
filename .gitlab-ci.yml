# ============================================================================
# GitLab CI/CD Pipeline for dysonprotocol2
# ============================================================================
#
# Stages:
#   1. dysvm       - Build CI image (Kaniko); bakes DYSVM assets in.
#   2. build-test  - Lint, binary build, and all tests run in parallel.
#                    Test jobs use needs: [build-dysond] to start as soon
#                    as the binary is ready, without waiting for lint.
#
# Releases are handled by GitHub Actions, not this pipeline.
# ============================================================================

stages:
  - dysvm
  - build-test

variables:
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:latest
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "1"
  GIT_SUBMODULE_DEPTH: "1"
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  CGO_ENABLED: "1"
  GOFLAGS: "-buildvcs=false"

# ---------------------------------------------------------------------------
# Reusable rule sets
# ---------------------------------------------------------------------------
.rules-default: &rules-default
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.rules-no-tags: &rules-no-tags
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage 1: dysvm — Build CI image
# Triggers on Dockerfile, DYSVM inputs, or BUILD_CI_IMAGE=true.
# Submodules are checked out (recursive) so Kaniko can COPY them.
# Cleans up dangling registry manifests after each push.
# ---------------------------------------------------------------------------
build-ci-image:
  stage: dysvm
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - dyson
  before_script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/.devcontainer/Dockerfile.dev
      --destination $CI_IMAGE
      --insecure
    - |
      REPO_ID=$(wget -qO- --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories" \
        | python3 -c "import sys,json; print(next(r['id'] for r in json.load(sys.stdin) if r.get('name')=='ci'))")
      wget -qO- --method=DELETE --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$REPO_ID/tags?name_regex_delete=.*&keep_n=1&older_than=1d" || true
  rules:
    - changes:
        - .devcontainer/Dockerfile.dev
        - .dockerignore
        - .gitmodules
        - dysvm/patch
        - dysvm/pbs-patch
        - requirements.txt
    - if: $BUILD_CI_IMAGE == "true"

# ---------------------------------------------------------------------------
# Default settings for all non-Kaniko jobs
# ---------------------------------------------------------------------------
default:
  image: $CI_IMAGE
  tags:
    - dyson
  before_script:
    - go version
    - python3 --version
    # Fix git ownership check for the runner's bind-mounted workspace
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git config --global --add safe.directory $CI_PROJECT_DIR/dysvm/cpython
    - git config --global --add safe.directory $CI_PROJECT_DIR/dysvm/go-embed-python
    - git config --global --add safe.directory $CI_PROJECT_DIR/dysvm/python-build-standalone
    # dysvm/internal/data/ is gitignored (generated); copy from the baked image.
    # Required by all Go tool invocations (vet, mod tidy, build).
    - make dysvm-assets

# ---------------------------------------------------------------------------
# Stage 2: build-test — Lint + Build + Test (all parallel)
# ---------------------------------------------------------------------------

go-vet:
  stage: build-test
  variables:
    GIT_SUBMODULE_PATHS: "cosmos-sdk dysvm/go-embed-python"
  script:
    - make vet
  <<: *rules-default

go-mod-tidy:
  stage: build-test
  variables:
    GIT_SUBMODULE_PATHS: "cosmos-sdk dysvm/go-embed-python"
  script:
    - make mod-tidy-check
  # Tags are immutable; go.mod drift on a tag is not actionable
  <<: *rules-no-tags

build-dysond:
  stage: build-test
  script:
    - make build
    - ./build/dysond version --long
  artifacts:
    paths:
      - build/dysond
    expire_in: 7 days
  <<: *rules-default

# ---------------------------------------------------------------------------
# Tests — all in build-test stage, start as soon as build-dysond finishes
# Whaleswap tests skipped (scope memory limits, to be fixed separately)
# ---------------------------------------------------------------------------
.test-template:
  stage: build-test
  needs:
    - build-dysond
  script:
    - $VENV/bin/playwright install chromium --with-deps || true
    - make test COVERAGE_PACKAGES= PYTEST_ARGS="${PYTEST_ARGS} --html=reports/pytest.html --self-contained-html --junitxml=reports/pytest.xml"
  artifacts:
    when: always
    paths:
      - reports/pytest.html
      - reports/pytest.xml
    reports:
      junit: reports/pytest.xml
    expire_in: 14 days
  <<: *rules-default

test-keeper:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/crontask/keeper tests/nameservice/keeper tests/nft/keeper tests/script/keeper tests/storage/keeper tests/whaleswap/keeper"

test-nameservice-bids:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/nameservice/bids"

test-dwapp:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/dysond/server/dwapp"

test-integration:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/test_chainnet.py tests/test_ante_implementation.py tests/crontask/subscriptions tests/nameservice tests/nft tests/script tests/storage tests/tew tests/tewl tests/upgrade tests/examples tests/x"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
