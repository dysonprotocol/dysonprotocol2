# ============================================================================
# GitLab CI/CD Pipeline for dysonprotocol2
# ============================================================================
#
# Stages:
#   1. lint        - Go vet, go mod tidy check
#   2. build       - DYSVM assets + dysond binary
#   3. test        - pytest suite (parallel by module)
#
# Releases are handled by GitHub Actions, not this pipeline.
#
# Prerequisites:
#   - GitLab Runner with Docker executor (docker+machine or docker runner)
#   - The Dockerfile.ci image must be built and available in the registry
#   - Run `make ci-build-image` once (or on Dockerfile.ci changes) to push it
#
# Runner tags: dyson (self-hosted runner with Docker support)
# ============================================================================

stages:
  - lint
  - build
  - test

variables:
  # Use the project's container registry for the CI image
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:latest
  DOCKER_DRIVER: overlay2
  # Don't shallow-clone; submodules need full history for checkout
  GIT_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: recursive
  # Enable Go module download caching
  GOPATH: /go
  GOMODCACHE: /go/pkg/mod
  # Non-interactive defaults for DYSVM and verify-requirements
  YES: "1"
  VERIFY_REQS_YES: "1"
  DYSVM_YES: "1"
  CGO_ENABLED: "1"
  GOFLAGS: -buildvcs=false
  # Coverage packages (from Makefile)
  COVERAGE_PACKAGES: "dysonprotocol.com/x/crontask/keeper,dysonprotocol.com/x/nameservice/keeper,dysonprotocol.com/x/nft/keeper,dysonprotocol.com/x/script/keeper,dysonprotocol.com/x/storage/keeper,dysonprotocol.com/x/whaleswap/keeper,dysonprotocol.com/dysond/server/dwapp"

# ---------------------------------------------------------------------------
# Default job settings
# ---------------------------------------------------------------------------
default:
  image: $CI_IMAGE
  before_script:
    - go version
    - python3 --version
  tags:
    - dyson

# ---------------------------------------------------------------------------
# Stage 1: Lint
# ---------------------------------------------------------------------------
go-vet:
  stage: lint
  script:
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

go-mod-tidy:
  stage: lint
  script:
    - go mod tidy
    - git diff --exit-code go.mod go.sum
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage 2: Build
# ---------------------------------------------------------------------------
build-dysond:
  stage: build
  script:
    - echo "Building DYSVM assets + dysond binary..."
    - make dysvm build
    - ./build/dysond version --long
  artifacts:
    paths:
      - build/dysond
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Stage 3: Test (parallel by module)
# ---------------------------------------------------------------------------
# The test jobs share the dysond binary from the build stage and run pytest
# against different module directories. Each job produces its own coverage
# and JUnit report. The COVERAGE_PACKAGES var is set globally so `make test`
# generates Go coverage alongside pytest.
#
# To add a new test shard: copy an existing test-* job and change PYTEST_ARGS
# to point at the new module directory.
# ---------------------------------------------------------------------------

.test-template:
  stage: test
  needs:
    - build-dysond
  script:
    - mkdir -p reports
    # Install Python test dependencies
    - make dev-install
    # Install pytest-html for HTML reports
    - ./.venv/bin/pip install pytest-html
    # Install Playwright browser for tests that use it (pytest.ini addopts
    # includes --browser chromium; override --headed with --headless in CI)
    - ./.venv/bin/playwright install chromium --with-deps || true
    # make test builds dysond with -cover, then runs pytest.
    # The build-dysond artifact gates this job but make test rebuilds independently.
    # Override --headed (from pytest.ini) with --headless for CI.
    - |
      make test PYTEST_ARGS="${PYTEST_ARGS} --headless --html=reports/pytest.html --self-contained-html --junitxml=reports/pytest.xml"
  coverage: '/^TOTAL\s+\S+\s+\S+\s+(\d+\.\d+)%$/'
  artifacts:
    when: always
    paths:
      - reports/pytest.html
      - reports/pytest.xml
      - coverage.out
      - coverage.txt
      - coverage.html
    reports:
      junit: reports/pytest.xml
    expire_in: 14 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test-keeper:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/crontask/keeper tests/nameservice/keeper tests/nft/keeper tests/script/keeper tests/storage/keeper tests/whaleswap/keeper"

test-whaleswap:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/whaleswap/amm tests/whaleswap/auction tests/whaleswap/leverage tests/whaleswap/arbitrage tests/whaleswap/orderbook"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
      allow_failure: true  # whaleswap hypothesis tests can be flaky

test-nameservice-bids:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/nameservice/bids"

test-dwapp:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/dysond/server/dwapp"

test-integration:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/chainnet.py tests/ante_implementation.py tests/crontask/subscriptions tests/nameservice tests/nft tests/script tests/storage tests/tew tests/tewl tests/upgrade tests/examples tests/x"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true  # integration tests can be slower / flaky on MRs

# ---------------------------------------------------------------------------
# CI Image Build Job
# ---------------------------------------------------------------------------
# Run this manually when Dockerfile.ci changes, or to refresh the base image.
# The image is pushed to the project's container registry.
# ---------------------------------------------------------------------------
build-ci-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t $CI_IMAGE -f Dockerfile.ci .
    - docker push $CI_IMAGE
  tags:
    - dyson
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile.ci
    - when: manual
  needs: []
