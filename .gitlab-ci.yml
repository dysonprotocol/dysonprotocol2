# ============================================================================
# GitLab CI/CD Pipeline for dysonprotocol2
# ============================================================================
#
# Stages:
#   1. image  - Build CI image from Dockerfile.dev (Kaniko, no DinD).
#               DYSVM is baked in via multi-stage build; submodules are
#               checked out by the runner so Kaniko can COPY them.
#   2. lint   - make vet, make mod-tidy-check
#   3. build  - make build (dysond binary)
#   4. test   - pytest suite (parallel by module)
#
# Releases are handled by GitHub Actions, not this pipeline.
# ============================================================================

stages:
  - image
  - lint
  - build
  - test

variables:
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:latest
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "1"
  GIT_SUBMODULE_DEPTH: "1"
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  CGO_ENABLED: "1"
  GOFLAGS: "-buildvcs=false"
  COVERAGE_PACKAGES: "dysonprotocol.com/x/crontask/keeper,dysonprotocol.com/x/nameservice/keeper,dysonprotocol.com/x/nft/keeper,dysonprotocol.com/x/script/keeper,dysonprotocol.com/x/storage/keeper,dysonprotocol.com/x/whaleswap/keeper,dysonprotocol.com/dysond/server/dwapp"

# ---------------------------------------------------------------------------
# Reusable rule sets
# ---------------------------------------------------------------------------
.rules-default: &rules-default
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.rules-no-tags: &rules-no-tags
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage 1: Image
# Build CI image when Dockerfile or DYSVM inputs change.
# Uses Kaniko (no Docker socket / DinD needed).
# GIT_SUBMODULE_STRATEGY: recursive ensures submodules are present for COPY.
# Set BUILD_CI_IMAGE=true to force a rebuild.
# ---------------------------------------------------------------------------
build-ci-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - dyson
  before_script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/.devcontainer/Dockerfile.dev
      --destination $CI_IMAGE
      --insecure
  rules:
    - changes:
        - .devcontainer/Dockerfile.dev
        - .dockerignore
        - .gitmodules
        - dysvm/patch
        - dysvm/pbs-patch
        - requirements.txt
    - if: $BUILD_CI_IMAGE == "true"

# ---------------------------------------------------------------------------
# Default settings for all non-Kaniko jobs
# ---------------------------------------------------------------------------
default:
  image: $CI_IMAGE
  tags:
    - dyson
  before_script:
    - go version
    - python3 --version
    # Fix git ownership check for the runner's bind-mounted workspace
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git config --global --add safe.directory $CI_PROJECT_DIR/dysvm/cpython
    - git config --global --add safe.directory $CI_PROJECT_DIR/dysvm/go-embed-python
    - git config --global --add safe.directory $CI_PROJECT_DIR/dysvm/python-build-standalone
    # Copy DYSVM assets baked into the image, or fail loudly if the image is stale
    - make dysvm-assets

# ---------------------------------------------------------------------------
# Stage 2: Lint
# ---------------------------------------------------------------------------
go-vet:
  stage: lint
  variables:
    GIT_SUBMODULE_PATHS: "cosmos-sdk dysvm/go-embed-python"
  script:
    - make vet
  <<: *rules-default

go-mod-tidy:
  stage: lint
  variables:
    GIT_SUBMODULE_PATHS: "cosmos-sdk dysvm/go-embed-python"
  script:
    - make mod-tidy-check
  # Tags are immutable; go.mod drift on a tag is not actionable
  <<: *rules-no-tags

# ---------------------------------------------------------------------------
# Stage 3: Build
# ---------------------------------------------------------------------------
build-dysond:
  stage: build
  script:
    - make build
    - ./build/dysond version --long
  artifacts:
    paths:
      - build/dysond
    expire_in: 7 days
  <<: *rules-default

# ---------------------------------------------------------------------------
# Stage 4: Test (parallel by module)
# ---------------------------------------------------------------------------
# Note: make test recompiles dysond with -cover instrumentation, so it does
# not reuse the build-dysond artifact. The needs: dependency is purely for
# gating (ensures the binary at least builds cleanly before running tests).
# ---------------------------------------------------------------------------
.test-template:
  stage: test
  needs:
    - build-dysond
  script:
    - make dev-install
    - $VENV/bin/pip install pytest-html
    - $VENV/bin/playwright install chromium --with-deps || true
    - make test PYTEST_ARGS="${PYTEST_ARGS} --html=reports/pytest.html --self-contained-html --junitxml=reports/pytest.xml"
  coverage: '/^TOTAL\s+\S+\s+\S+\s+(\d+\.\d+)%$/'
  artifacts:
    when: always
    paths:
      - reports/pytest.html
      - reports/pytest.xml
      - coverage.out
      - coverage.txt
      - coverage.html
    reports:
      junit: reports/pytest.xml
    expire_in: 14 days
  <<: *rules-default

test-keeper:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/crontask/keeper tests/nameservice/keeper tests/nft/keeper tests/script/keeper tests/storage/keeper tests/whaleswap/keeper"

test-whaleswap:
  extends: .test-template
  allow_failure: true
  variables:
    PYTEST_ARGS: "tests/whaleswap/amm tests/whaleswap/auction tests/whaleswap/leverage tests/whaleswap/arbitrage tests/whaleswap/orderbook"

test-nameservice-bids:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/nameservice/bids"

test-dwapp:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/dysond/server/dwapp"

test-integration:
  extends: .test-template
  variables:
    PYTEST_ARGS: "tests/chainnet.py tests/ante_implementation.py tests/crontask/subscriptions tests/nameservice tests/nft tests/script tests/storage tests/tew tests/tewl tests/upgrade tests/examples tests/x"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      allow_failure: true
