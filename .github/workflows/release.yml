name: Build and Release dysond

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

env:
  CI_IMAGE: ghcr.io/${{ github.repository }}/ci:latest

jobs:
  # Build the CI image (same Dockerfile.dev as GitLab) and push to GHCR.
  # Only rebuilds when Dockerfile or DYSVM inputs change.
  build-ci-image:
    runs-on: self-hosted
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'
          clean: true

      - name: Clean stale build artifacts in submodules
        run: git submodule foreach --recursive git clean -fdx .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile.dev
          push: true
          tags: ${{ env.CI_IMAGE }}

      - name: Clean dangling images
        if: always()
        run: docker image prune -f

  build-release:
    needs: build-ci-image
    runs-on: self-hosted
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'
          clean: true

      - name: Setup DYSVM assets
        run: make dysvm-assets

      - name: Lint
        run: make vet mod-tidy-check

      - name: Build dysond binary
        run: make build && ./build/dysond version --long

      - name: Run tests
        run: |
          mkdir -p reports
          make test COVERAGE_PACKAGES= PYTEST_ARGS="tests/crontask/keeper tests/nameservice/keeper tests/nft/keeper tests/script/keeper tests/storage/keeper tests/whaleswap/keeper tests/nameservice/bids --html=reports/pytest.html --self-contained-html --junitxml=reports/pytest.xml"

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            reports/pytest.html
            reports/pytest.xml

      - name: Set release name
        run: echo "RELEASE_NAME=dysond-$(uname -m)-${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Compress dysond binary
        run: |
          set -euo pipefail
          : "${RELEASE_NAME:?RELEASE_NAME not set}"
          zip -j "${RELEASE_NAME}.zip" "build/dysond"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}.zip
          path: ./${{ env.RELEASE_NAME }}.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{ env.RELEASE_NAME }}.zip
          asset_name: ${{ env.RELEASE_NAME }}.zip
          tag: ${{ github.ref }}
          overwrite: true
