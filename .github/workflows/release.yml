name: Build and Release dysond

on:
  push:
    branches:
      - develop
    tags:
      - '*'

jobs:
  build-release:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Build dysond
        run: make dysvm build

      - name: Install dev deps and run tests
        run: |
          make dev-install
          ./.venv/bin/pip install pytest-html
          mkdir -p reports
          make test PYTEST_ARGS="--html=reports/pytest.html --self-contained-html  -n 4"

      - name: Set release name env
        run: echo "RELEASE_NAME=dysond-$(uname -m)-${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Upload pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.html

      - name: Compress dysond binary
        run: |
          set -euo pipefail
          : "${RELEASE_NAME:?RELEASE_NAME not set}"
          if ! command -v zip > /dev/null 2>&1; then
            echo "zip command not found on runner" >&2
            exit 1
          fi
          zip -j "${RELEASE_NAME}.zip" "build/dysond"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: ./${{ env.RELEASE_NAME }}.zip
      