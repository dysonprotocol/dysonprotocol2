name: Build and Release dysond

on:
  push:
    branches:
      - develop
    tags:
      - '*'

jobs:
  build-release:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Build dysond
        run: make dysvm build

      - name: Install dev deps and run tests
        run: |
          make dev-install
          make test

      - name: Set ARCH env
        run: echo "ARCH=$(uname -m)" >> $GITHUB_ENV

      - name: Compress dysond binary
        run: |
          set -euo pipefail
          : "${ARCH:?ARCH not set}"
          if ! command -v zip > /dev/null 2>&1; then
            echo "zip command not found on runner" >&2
            exit 1
          fi
          zip -j "dysond-${ARCH}-${{ github.ref_name }}.zip" "build/dysond"

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dysond-${{ env.ARCH }}-${{ github.ref_name }}
          path: ./dysond-${{ env.ARCH }}-${{ github.ref_name }}.zip
