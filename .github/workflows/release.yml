name: Build and Release dysond

on:
  push:
    branches:
      - develop
    tags:
      - '*'

jobs:
  build-release:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Build dysond
        run: make dysvm build

      - name: Install dev deps and run tests
        run: |
          make dev-install
          make test

      - name: Set ARCH env
        run: echo "ARCH=$(uname -m)" >> $GITHUB_ENV

      - name: Compress dysond binary
        uses: somaz94/compress-decompress@v1
        with:
          command: compress
          source: build/dysond
          format: zip
          dest: '.'
          destfilename: 'dysond-${{ env.ARCH }}'

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: dysond-${{ env.ARCH }}
          path: ./dysond-${{ env.ARCH }}.zip
