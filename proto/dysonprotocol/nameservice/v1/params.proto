syntax = "proto3";
package dysonprotocol.nameservice.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/duration.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "dysonprotocol.com/x/nameservice/types";

// Params defines the parameters for the nameservice module.
message Params {
  // mint_fee_per_coin defines the fee in udys charged per coin minted
  string mint_fee_per_coin = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"mint_fee_per_coin\""
  ];

  // Bounds for per-class bidding parameters
  // Class bid_timeout must be within [min_bid_timeout_class,
  // max_bid_timeout_class]
  google.protobuf.Duration min_bid_timeout_class = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true,
    (gogoproto.moretags) = "yaml:\"min_bid_timeout_class\""
  ];
  google.protobuf.Duration max_bid_timeout_class = 8 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true,
    (gogoproto.moretags) = "yaml:\"max_bid_timeout_class\""
  ];

  // Class reject fee percent must be within
  // [min_reject_bid_valuation_fee_percent,
  // max_reject_bid_valuation_fee_percent]
  string min_reject_bid_valuation_fee_percent = 9 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"min_reject_bid_valuation_fee_percent\""
  ];
  string max_reject_bid_valuation_fee_percent = 10 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"max_reject_bid_valuation_fee_percent\""
  ];

  // Class minimum bid percent increase must be within
  // [min_minimum_bid_percent_increase, max_minimum_bid_percent_increase]
  string min_minimum_bid_percent_increase = 11 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"min_minimum_bid_percent_increase\""
  ];
  string max_minimum_bid_percent_increase = 12 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"max_minimum_bid_percent_increase\""
  ];

  // Class valuation fee percent must be within
  // [min_valuation_fee_pct, max_valuation_fee_pct]
  string min_valuation_fee_pct = 13 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"min_valuation_fee_pct\""
  ];
  string max_valuation_fee_pct = 14 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"max_valuation_fee_pct\""
  ];

  // Class valuation period bounds must be within
  // [min_valuation_period, max_valuation_period]
  google.protobuf.Duration min_valuation_period = 15 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true,
    (gogoproto.moretags) = "yaml:\"min_valuation_period\""
  ];
  google.protobuf.Duration max_valuation_period = 16 [
    (gogoproto.nullable) = false,
    (gogoproto.stdduration) = true,
    (gogoproto.moretags) = "yaml:\"max_valuation_period\""
  ];

  // reserved_names defines a newline-separated list of forbidden .dys names
  // that cannot be registered via the normal commit-reveal process.
  // Blank lines and lines starting with # are ignored.
  // Reserved names can still be created via CreateExternalName (governance
  // only).
  // If this field is blank in MsgUpdateParams, the existing value is preserved
  // and not updated.
  string reserved_names = 17
      [ (gogoproto.moretags) = "yaml:\"reserved_names\"" ];

  // name_suffix is the suffix for all registered names (e.g., ".dys").
  // This is set at genesis and should NOT be changed after chain launch.
  // All names must end with this suffix (e.g., "alice.dys", "myapp.dys").
  string name_suffix = 18 [ (gogoproto.moretags) = "yaml:\"name_suffix\"" ];
}