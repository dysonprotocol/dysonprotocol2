syntax = "proto3";
package dysonprotocol.nameservice.v1;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "dysonprotocol/nameservice/v1/params.proto";
import "google/protobuf/timestamp.proto";
import "amino/amino.proto";
import "cosmos/bank/v1beta1/bank.proto";
import "google/protobuf/duration.proto";
option go_package = "dysonprotocol.com/x/nameservice/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  /*
   * Commit creates a commitment for name registration using commit-reveal
   * scheme. Stores hash commitment that can be revealed later to prevent
   * front-running.
   */
  rpc Commit(MsgCommit) returns (MsgCommitResponse);
  /*
   * Reveal completes name registration by validating revealed name matches
   * commitment hash. Mints Name NFT, charges valuation fee, and creates reverse
   * mapping for resolution.
   */
  rpc Reveal(MsgReveal) returns (MsgRevealResponse);
  /*
   * SetValuation updates the self-valuation of an NFT, charging Harberger tax
   * on increases. Fee goes to community pool or class owner based on governance
   * status.
   */
  rpc SetValuation(MsgSetValuation) returns (MsgSetValuationResponse);
  /*
   * Renew extends valuation expiry by charging proportional annual fee.
   * Fee is paid to the NFT class owner.
   */
  rpc Renew(MsgRenew) returns (MsgRenewResponse);
  /*
   * PlaceBid places or outbids on a listed NFT, escrowing funds until
   * acceptance or expiry. First bids must meet/exceed valuation; subsequent
   * bids require minimum increase percentage.
   */
  rpc PlaceBid(MsgPlaceBid) returns (MsgPlaceBidResponse);
  /*
   * AcceptBid accepts current active bid, transferring NFT ownership and
   * releasing escrowed funds. Updates NFT valuation to accepted bid amount and
   * clears bid state.
   */
  rpc AcceptBid(MsgAcceptBid) returns (MsgAcceptBidResponse);
  /*
   * RejectBid rejects current bid and sets new valuation, charging rejection
   * fee. Fee routing: to NFT class owner for user-controlled classes, to
   * community pool for governance-controlled classes. Refunds the rejected
   * bidder's escrowed bid amount back to them.
   */
  rpc RejectBid(MsgRejectBid) returns (MsgRejectBidResponse);
  /*
   * ClaimBid allows bidder to claim NFT after bid timeout expires without
   * acceptance. Transfers escrowed bid to previous owner and NFT ownership to
   * bidder.
   */
  rpc ClaimBid(MsgClaimBid) returns (MsgClaimBidResponse);
  rpc SetDestination(MsgSetDestination) returns (MsgSetDestinationResponse);
  // SetNameMetadata allows the owner of a name (NFT in nameservice.dys) to set
  // the metadata string for that name. Only the owner can call this.
  rpc SetNameMetadata(MsgSetNameMetadata) returns (MsgSetNameMetadataResponse);
  rpc SetNFTMetadata(MsgSetNFTMetadata) returns (MsgSetNFTMetadataResponse);
  rpc SetNFTClassExtraData(MsgSetNFTClassExtraData)
      returns (MsgSetNFTClassExtraDataResponse);
  // SetNFTClassAlwaysListed sets the always_listed flag for an NFT class
  rpc SetNFTClassAlwaysListed(MsgSetNFTClassAlwaysListed)
      returns (MsgSetNFTClassAlwaysListedResponse);
  // Set per-class valuation fee percent and period
  rpc SetNFTClassValuationFeePct(MsgSetNFTClassValuationFeePct)
      returns (MsgSetNFTClassValuationFeePctResponse);
  rpc SetNFTClassValuationPeriod(MsgSetNFTClassValuationPeriod)
      returns (MsgSetNFTClassValuationPeriodResponse);
  // Per-class bidding params setters
  rpc SetNFTClassBidTimeout(MsgSetNFTClassBidTimeout)
      returns (MsgSetNFTClassBidTimeoutResponse);
  rpc SetNFTClassAllowedDenoms(MsgSetNFTClassAllowedDenoms)
      returns (MsgSetNFTClassAllowedDenomsResponse);
  rpc SetNFTClassRejectBidValuationFeePercent(
      MsgSetNFTClassRejectBidValuationFeePercent)
      returns (MsgSetNFTClassRejectBidValuationFeePercentResponse);
  rpc SetNFTClassMinimumBidPercentIncrease(
      MsgSetNFTClassMinimumBidPercentIncrease)
      returns (MsgSetNFTClassMinimumBidPercentIncreaseResponse);
  // SetListed sets the listed status for a specific NFT
  rpc SetListed(MsgSetListed) returns (MsgSetListedResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc MintCoins(MsgMintCoins) returns (MsgMintCoinsResponse);
  rpc BurnCoins(MsgBurnCoins) returns (MsgBurnCoinsResponse);
  rpc SetDenomMetadata(MsgSetDenomMetadata)
      returns (MsgSetDenomMetadataResponse);
  // Allow the denom root owner to set description only
  rpc SetDenomDescription(MsgSetDenomDescription)
      returns (MsgSetDenomDescriptionResponse);
  // Allow the denom root owner to set URI and URI hash only
  rpc SetDenomURI(MsgSetDenomURI) returns (MsgSetDenomURIResponse);
  rpc SaveClass(MsgSaveClass) returns (MsgSaveClassResponse);
  // DeleteClass removes an NFT class. Only allowed if the class has no NFTs.
  rpc DeleteClass(MsgDeleteClass) returns (MsgDeleteClassResponse);
  rpc MintNFT(MsgMintNFT) returns (MsgMintNFTResponse);
  rpc BurnNFT(MsgBurnNFT) returns (MsgBurnNFTResponse);
  rpc MoveCoins(MsgMoveCoins) returns (MsgMoveCoinsResponse);
  rpc MoveNft(MsgMoveNft) returns (MsgMoveNftResponse);
  rpc CreateExternalName(MsgCreateExternalName)
      returns (MsgCreateExternalNameResponse);
}

/*
 * MsgCommit creates a commitment for name registration using commit-reveal
 * scheme. Stores hash commitment that can be revealed later to prevent
 * front-running.
 *
 * Behavior:
 * - Stores commitment with hash, owner, timestamp, and proposed valuation.
 * - Commitment hash must be unique and computed as hash(name + committer +
 * salt).
 * - Valuation specifies the initial self-valuation for the name NFT.
 *
 * Validation:
 * - Committer address must be valid bech32.
 * - Hexhash cannot be empty and must be unique.
 * - Valuation must be valid according to nameservice class rules.
 *
 * Emits:
 * - EventCommitmentCreated(hexhash) on successful commitment.
 *
 * Returns:
 * - Empty response on success.
 */
message MsgCommit {
  option (cosmos.msg.v1.signer) = "committer";
  // Address that will own the name after successful reveal.
  string committer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Hex-encoded hash of (name + committer + salt) computed by client.
  string hexhash = 2;
  // Proposed valuation for the name NFT (determines annual fee rate).
  cosmos.base.v1beta1.Coin valuation = 3 [ (gogoproto.nullable) = false ];
}
/*
 * Empty response for successful commitment creation.
 */
message MsgCommitResponse {}

/*
 * MsgReveal completes name registration by revealing the committed name and
 * salt. Validates revealed data matches commitment hash and mints Name NFT.
 *
 * Behavior:
 * - Validates revealed name + salt produce the committed hash.
 * - Mints new Name NFT in nameservice.dys class with name as NFT ID.
 * - Charges annual valuation fee to community pool based on committed
 * valuation.
 * - Sets NFT data with valuation, expiry, and default listing status.
 * - Creates reverse mapping from owner address to name for resolution.
 * - Deletes the used commitment after successful registration.
 *
 * Validation:
 * - Committer address must be valid bech32.
 * - Name must match format regex (lowercase, alphanumeric+dashes, ends with
 * .dys).
 * - Name must not already be registered.
 * - Commitment must exist for computed hash (name + committer + salt).
 * - Revealed committer must match commitment owner.
 * - Valuation from commitment must be valid and non-zero.
 *
 * Emits:
 * - EventNameRegistered(name, fee) on successful registration.
 *
 * Returns:
 * - Empty response on success.
 */
message MsgReveal {
  option (cosmos.msg.v1.signer) = "committer";
  // Address that committed to this name registration (must match commitment
  // owner).
  string committer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Name to register (must match commitment hash when combined with salt).
  string name = 2;
  // Salt used in commitment hash calculation (revealed here).
  string salt = 3;
}
/*
 * Empty response for successful name registration.
 */
message MsgRevealResponse {}

message MsgCreateExternalName {
  option (cosmos.msg.v1.signer) = "authority";
  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten)
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // name is the external name to create (e.g. "example.com", "sub.domain.org")
  string name = 2;
}
message MsgCreateExternalNameResponse {}

/*
 * MsgSetValuation updates the self-valuation of an NFT, charging Harberger tax
 * on increases.
 *
 * Behavior:
 * - Updates NFT valuation, charging fee only on incremental increases.
 * - Fee is proportional to remaining time in current valuation period.
 * - Fee destination depends on NFT class ownership (community pool vs class
 * owner).
 * - Valuation expiry remains unchanged; use MsgRenew to extend expiry.
 *
 * Validation:
 * - Sender must be NFT owner.
 * - NFT valuation must not be expired.
 * - No active bids can exist (reject bids first).
 * - New valuation must be valid according to class rules.
 * - Max fee percent guard prevents unexpected fee increases.
 *
 * Emits:
 * - EventNameValuationUpdated(name, new_valuation) on successful update.
 *
 * Returns:
 * - Empty response on success.
 */
message MsgSetValuation {
  option (cosmos.msg.v1.signer) = "owner";
  // NFT owner address performing the valuation update.
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // NFT class identifier.
  string nft_class_id = 2;
  // NFT identifier within the class.
  string nft_id = 3;
  // New valuation amount for the NFT.
  cosmos.base.v1beta1.Coin valuation = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  // Maximum valuation fee percentage the user is willing to pay (e.g. "0.025"
  // for 2.5%). Guards against unexpected fee amounts if class parameters
  // change.
  string max_valuation_fee_pct = 5;
}
/*
 * Empty response for successful valuation update.
 */
message MsgSetValuationResponse {}

/*
 * MsgRenew extends NFT valuation expiry by charging proportional annual fee.
 *
 * Behavior:
 * - Extends valuation expiry by one full valuation period.
 * - Calculates fee as: current_valuation × fee_percent × (period /
 * valuation_period).
 * - Handles retroactive renewal if expiry has already passed.
 * - Fee is paid to the NFT class owner.
 *
 * Validation:
 * - Payer address must be valid.
 * - NFT must exist with valid valuation.
 * - Class must have valuation period and fee percentage configured.
 *
 * Emits:
 * - EventNameRenewed(name, new_expiry) on successful renewal.
 *
 * Returns:
 * - New expiry timestamp.
 */
message MsgRenew {
  option (cosmos.msg.v1.signer) = "payer";
  // Address paying for the renewal fee.
  string payer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // NFT class identifier.
  string nft_class_id = 2;
  // NFT identifier within the class.
  string nft_id = 3;
}
message MsgRenewResponse {
  // New valuation expiry timestamp after renewal.
  google.protobuf.Timestamp expiry = 1
      [ (gogoproto.stdtime) = true, (gogoproto.nullable) = false ];
}

/*
 * MsgPlaceBid places or outbids on a listed NFT, escrowing funds until
 * acceptance or expiry.
 *
 * Behavior:
 * - Places bid on listed NFT, refunding any previous bidder.
 * - First bids must meet/exceed current valuation.
 * - Subsequent bids must exceed current bid by minimum percentage increase.
 * - Funds escrowed in module until bid accepted, rejected, or claimed after
 * timeout.
 *
 * Validation:
 * - Bid amount must be valid according to class rules.
 * - NFT must be listed (directly or via class always_listed).
 * - Cannot bid on authority-owned or module-owned NFTs.
 * - Bid denomination must match valuation/current bid.
 * - Bid must meet minimum increase requirements.
 *
 * Emits:
 * - EventBidPlaced(class_id, nft_id, bidder, bid_amount) on successful bid.
 *
 * Returns:
 * - Empty response on success.
 */
message MsgPlaceBid {
  option (cosmos.msg.v1.signer) = "bidder";
  // Address placing the bid.
  string bidder = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // NFT class identifier.
  string nft_class_id = 2;
  // NFT identifier within the class.
  string nft_id = 3;
  // Bid amount to offer for the NFT.
  cosmos.base.v1beta1.Coin bid_amount = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}
/*
 * Empty response for successful bid placement.
 */
message MsgPlaceBidResponse {}

/*
 * MsgAcceptBid accepts current active bid, transferring NFT ownership and
 * releasing escrowed funds.
 *
 * Behavior:
 * - Accepts highest current bid on owned NFT.
 * - Transfers escrowed bid amount to current NFT owner.
 * - Transfers NFT ownership to bidder.
 * - Updates NFT valuation to accepted bid amount.
 * - Clears all bid-related state.
 *
 * Validation:
 * - Sender must be current NFT owner.
 * - NFT must have active bid (non-zero amount and bidder).
 *
 * Emits:
 * - EventBidAccepted(class_id, nft_id, new_owner) on successful acceptance.
 *
 * Returns:
 * - Empty response on success.
 */
message MsgAcceptBid {
  option (cosmos.msg.v1.signer) = "owner";
  // Current NFT owner accepting the bid.
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // NFT class identifier.
  string nft_class_id = 2;
  // NFT identifier within the class.
  string nft_id = 3;
}
/*
 * Empty response for successful bid acceptance.
 */
message MsgAcceptBidResponse {}

/*
 * MsgRejectBid rejects current bid and sets new valuation, charging rejection
 * fee.
 *
 * Behavior:
 * - Rejects current active bid on owned NFT.
 * - Sets new NFT valuation, charging rejection fee proportional to new
 * valuation.
 * - Rejection fee routing: to NFT class owner for user-controlled classes, to
 * community pool for governance-controlled classes.
 * - Refunds the rejected bidder's escrowed bid amount back to them.
 * - Clears bid state from NFT.
 *
 * Validation:
 * - Sender must be current NFT owner.
 * - NFT must have active bid to reject.
 * - New valuation must be valid and higher than current.
 *
 * Emits:
 * - EventBidRejected(class_id, nft_id, rejection_fee) on successful rejection.
 *
 * Returns:
 * - Rejection fee amount collected.
 */
message MsgRejectBid {
  option (cosmos.msg.v1.signer) = "owner";
  // Current NFT owner rejecting the bid.
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // NFT class identifier.
  string nft_class_id = 2;
  // NFT identifier within the class.
  string nft_id = 3;
  // New valuation amount (must be higher than current valuation).
  cosmos.base.v1beta1.Coin new_valuation = 4
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}
message MsgRejectBidResponse {
  // Fee collected by the NFT class owner when a bid is rejected.
  repeated cosmos.base.v1beta1.Coin rejection_fee = 1
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

/*
 * MsgClaimBid allows bidder to claim NFT after bid timeout expires without
 * acceptance.
 *
 * Behavior:
 * - Allows bidder to claim NFT ownership after bid timeout.
 * - Transfers escrowed bid amount to previous owner.
 * - Transfers NFT ownership to bidder.
 * - Updates NFT valuation to claimed bid amount.
 * - Resets valuation expiry to bid timestamp.
 *
 * Validation:
 * - NFT must have active bid.
 * - Sender must be current bidder.
 * - Bid timeout period must have elapsed since bid placement.
 *
 * Emits:
 * - EventBidClaimed(class_id, nft_id, bidder) on successful claim.
 *
 * Returns:
 * - Empty response on success.
 */
message MsgClaimBid {
  option (cosmos.msg.v1.signer) = "bidder";
  // Bidder claiming the NFT after timeout.
  string bidder = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // NFT class identifier.
  string nft_class_id = 2;
  // NFT identifier within the class.
  string nft_id = 3;
}
/*
 * Empty response for successful bid claim.
 */
message MsgClaimBidResponse {}

message MsgSetDestination {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string name = 2;
  string destination = 3;
}
message MsgSetDestinationResponse {}

// MsgSetNameMetadata allows the owner of a name (NFT in nameservice.dys) to set
// the metadata string for that name. Only the owner can call this.
message MsgSetNameMetadata {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string name = 2;     // the name NFT id (in class nameservice.dys)
  string metadata = 3; // new metadata string
}
message MsgSetNameMetadataResponse {}

message MsgSetNFTMetadata {
  option (cosmos.msg.v1.signer) = "name_destination";
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;
  string nft_id = 3;
  string metadata = 4;
  string uri = 5;
  string uri_hash = 6;
}
message MsgSetNFTMetadataResponse {}

message MsgSetNFTClassExtraData {
  option (cosmos.msg.v1.signer) = "name_destination";
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;
  string extra_data = 3;
}
message MsgSetNFTClassExtraDataResponse {}

// MsgSetNFTClassAlwaysListed sets the always_listed flag for an NFT class.
// Only the owner of the NFT class root name can update this setting.
message MsgSetNFTClassAlwaysListed {
  option (cosmos.msg.v1.signer) = "name_destination";
  // name_destination is the resolved destination address of the NFT class root
  // name
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // class_id is the identifier of the NFT class to update
  string class_id = 2;
  // always_listed determines if NFTs in this class should always be listed for
  // sale and override the listed status of the individual NFTs
  bool always_listed = 3;
}

// MsgSetNFTClassAlwaysListedResponse defines the response for
// MsgSetNFTClassAlwaysListed
message MsgSetNFTClassAlwaysListedResponse {}

// Set per-class valuation fee percent (cosmos.Dec string)
message MsgSetNFTClassValuationFeePct {
  option (cosmos.msg.v1.signer) = "name_destination";
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;
  string valuation_fee_pct = 3; // plain string; parsed as Dec in keeper
}
message MsgSetNFTClassValuationFeePctResponse {}

// Set per-class valuation period (duration)
message MsgSetNFTClassValuationPeriod {
  option (cosmos.msg.v1.signer) = "name_destination";
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;
  google.protobuf.Duration valuation_period = 3
      [ (gogoproto.stdduration) = true, (gogoproto.nullable) = false ];
}
message MsgSetNFTClassValuationPeriodResponse {}

// MsgSetNFTClassBidTimeout sets the per-class bid timeout duration.
message MsgSetNFTClassBidTimeout {
  option (cosmos.msg.v1.signer) = "name_destination";
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;
  google.protobuf.Duration bid_timeout = 3
      [ (gogoproto.stdduration) = true, (gogoproto.nullable) = false ];
}
message MsgSetNFTClassBidTimeoutResponse {}

// MsgSetNFTClassAllowedDenoms sets the per-class allowed denoms list.
message MsgSetNFTClassAllowedDenoms {
  option (cosmos.msg.v1.signer) = "name_destination";
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;
  repeated string allowed_denoms = 3;
}
message MsgSetNFTClassAllowedDenomsResponse {}

// MsgSetNFTClassRejectBidValuationFeePercent sets the per-class reject fee
// percent.
message MsgSetNFTClassRejectBidValuationFeePercent {
  option (cosmos.msg.v1.signer) = "name_destination";
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;
  string reject_bid_valuation_fee_percent =
      3; // plain string; parsed as Dec in keeper
}
message MsgSetNFTClassRejectBidValuationFeePercentResponse {}

// MsgSetNFTClassMinimumBidPercentIncrease sets the per-class minimum bid
// increase percent.
message MsgSetNFTClassMinimumBidPercentIncrease {
  option (cosmos.msg.v1.signer) = "name_destination";
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;
  string minimum_bid_percent_increase =
      3; // plain string; parsed as Dec in keeper
}
message MsgSetNFTClassMinimumBidPercentIncreaseResponse {}

// MsgSetListed sets the listed status for a specific NFT.
// Only the owner of the NFT can update this setting.
message MsgSetListed {
  option (cosmos.msg.v1.signer) = "nft_owner";
  // nft_owner is the address of the NFT owner
  string nft_owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // nft_class_id is the identifier of the NFT class
  string nft_class_id = 2;
  // nft_id is the identifier of the specific NFT
  string nft_id = 3;
  // listed determines if the NFT should be listed for sale but is overridden by
  // the NFTClass.always_listed parameter.
  bool listed = 4;
}

// MsgSetListedResponse defines the response for MsgSetListed
message MsgSetListedResponse {}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // params defines the x/nameservice parameters to update.
  //
  // NOTE: All parameters must be supplied, except reserved_names which is
  // optional. If reserved_names is blank, the existing value will be preserved.
  Params params = 2 [ (gogoproto.nullable) = false ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgMintCoins mints coins into the owner's balance, as long as each coin's
// "root name" is owned by that owner.
message MsgMintCoins {
  option (cosmos.msg.v1.signer) = "name_destination";
  // name_destination must be a valid address
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // Using repeated cosmos.base.v1beta1.Coin with the annotation
  // (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  // so that the generated Go code will have `Amount sdk.Coins` automatically.
  repeated cosmos.base.v1beta1.Coin amount = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // mint_fee is the explicit fee authorization provided by the caller.
  // It must be in udys and be >= the required fee computed as
  // sum(amount[i].amount) * params.mint_fee_per_coin (ceil to integer).
  cosmos.base.v1beta1.Coin mint_fee = 3
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// Response for MintCoins
message MsgMintCoinsResponse {}

// MsgBurnCoins burns coins from the owner's balance, if each coin's root name
// is owned by that owner.
message MsgBurnCoins {
  option (cosmos.msg.v1.signer) = "name_destination";
  // name_destination address
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // Using the same annotation as MintCoins for consistency
  repeated cosmos.base.v1beta1.Coin amount = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

// Response for BurnCoins
message MsgBurnCoinsResponse {}

// MsgSetDenomMetadata allows a governance-authorized account to set denom
// metadata.
message MsgSetDenomMetadata {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // The bank module metadata describing the denom, display, base, etc.
  cosmos.bank.v1beta1.Metadata metadata = 2 [ (gogoproto.nullable) = false ];
}

// MsgSetDenomMetadataResponse defines the response structure for executing a
// MsgSetDenomMetadata message.
message MsgSetDenomMetadataResponse {}

// MsgSetDenomDescription lets the name destination of the denom root set
// description.
message MsgSetDenomDescription {
  option (cosmos.msg.v1.signer) = "name_destination";

  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // base denom to modify
  string denom = 2;
  string description = 3;
}

message MsgSetDenomDescriptionResponse {}

// MsgSetDenomURI lets the name destination of the denom root set URI and URI
// hash.
message MsgSetDenomURI {
  option (cosmos.msg.v1.signer) = "name_destination";

  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // base denom to modify
  string denom = 2;
  // optional
  string uri = 3;
  // optional
  string uri_hash = 4;
}

message MsgSetDenomURIResponse {}

// SaveClass
message MsgSaveClass {
  option (cosmos.msg.v1.signer) = "name_destination";

  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2;    // must match regex
  string name = 3;        // optional
  string symbol = 4;      // optional
  string description = 5; // optional
  string uri = 6;         // optional
  string uri_hash = 7;    // optional
}

message MsgSaveClassResponse {}

// DeleteClass
message MsgDeleteClass {
  option (cosmos.msg.v1.signer) = "name_destination";

  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2; // must exist and contain zero NFTs
}

message MsgDeleteClassResponse {}

// MintNFT
message MsgMintNFT {
  option (cosmos.msg.v1.signer) = "name_destination";

  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2; // must exist
  string nft_id = 3;   // must match printable ASCII
  string uri = 4;      // optional
  string uri_hash = 5; // optional
}

message MsgMintNFTResponse {}

// BurnNFT
message MsgBurnNFT {
  option (cosmos.msg.v1.signer) = "name_destination";

  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string class_id = 2; // must exist
  string nft_id = 3;   // must exist
}

message MsgBurnNFTResponse {}

// MsgMoveCoins force moves custom denom coins between two accounts if signer
// owns the root name of each coin denom.
message MsgMoveCoins {
  option (cosmos.msg.v1.signer) = "name_destination";
  // Signer must be the resolved destination of the root name of each coin denom
  // in all inputs.
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // One or multiple inputs: each account holding the coins.
  repeated cosmos.bank.v1beta1.Input inputs = 2
      [ (gogoproto.nullable) = false ];

  // One or multiple outputs: the account receiving the coins.
  repeated cosmos.bank.v1beta1.Output outputs = 3
      [ (gogoproto.nullable) = false ];
}

message MsgMoveCoinsResponse {}

// MsgMoveNft force moves an NFT between accounts when signer owns the NFT
// class.
message MsgMoveNft {
  option (cosmos.msg.v1.signer) = "name_destination";
  // Signer must be the resolved destination of the class root name
  string name_destination = 1
      [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // NFT class ID
  string class_id = 2;
  // NFT ID
  string nft_id = 3;

  // Destination holder (non-module)
  string to_address = 4 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message MsgMoveNftResponse {}