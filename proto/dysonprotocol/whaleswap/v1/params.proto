syntax = "proto3";
package dysonprotocol.whaleswap.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "google/protobuf/duration.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "dysonprotocol.com/x/whaleswap/types";

// ArbitrageMode determines how the protocol handles arbitrage opportunities.
enum ArbitrageMode {
  // ARBITRAGE_MODE_UNSPECIFIED defaults to AUTO for backwards compatibility.
  ARBITRAGE_MODE_UNSPECIFIED = 0;
  // ARBITRAGE_MODE_DISABLED completely disables arbitrage detection and
  // execution.
  ARBITRAGE_MODE_DISABLED = 1;
  // ARBITRAGE_MODE_MANUAL allows arbitrage queries/simulation but no automatic
  // execution.
  ARBITRAGE_MODE_MANUAL = 2;
  // ARBITRAGE_MODE_AUTO enables automatic arbitrage execution after trades.
  ARBITRAGE_MODE_AUTO = 3;
}

message Params {
  // pfand_per_offer is the PFAND coin required for liquid-mode offers.
  cosmos.base.v1beta1.Coin pfand_per_offer = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"pfand_per_offer\""
  ];

  // Default auction knobs applied when creating auction NFT classes
  // via whaleswap. These mirror nameservice per-class policy knobs.

  // valuation_fee_pct is the percentage applied per valuation_period.
  string valuation_fee_pct = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"valuation_fee_pct\""
  ];

  // valuation_period defines the time duration to which valuation_fee_pct
  // applies.
  google.protobuf.Duration valuation_period = 3 [
    (gogoproto.stdduration) = true,
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"valuation_period\""
  ];

  // bid_timeout defines the minimum duration a placed bid must remain pending
  // before it can be claimed by the bidder.
  google.protobuf.Duration bid_timeout = 4 [
    (gogoproto.stdduration) = true,
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"bid_timeout\""
  ];

  // minimum_bid_percent_increase specifies the minimum percent increase
  // required over the current valuation for a new bid to be accepted.
  string minimum_bid_percent_increase = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.moretags) = "yaml:\"minimum_bid_percent_increase\""
  ];
  uint32 max_note_length = 6
      [ (gogoproto.moretags) = "yaml:\"max_note_length\"" ];

  // ═════ LEVERAGE PARAMETERS ═════
  // Block delay before position owner can close position
  uint64 block_delay_before_close = 7
      [ (gogoproto.moretags) = "yaml:\"block_delay_before_close\"" ];

  // Block delay before liquidation can be finalized after initialization
  uint64 block_delay_before_liquidation = 8
      [ (gogoproto.moretags) = "yaml:\"block_delay_before_liquidation\"" ];

  // ═════ ARBITRAGE PARAMETERS ═════
  // arbitrage_mode controls protocol arbitrage behavior.
  ArbitrageMode arbitrage_mode = 9
      [ (gogoproto.moretags) = "yaml:\"arbitrage_mode\"" ];

  // arbitrage_ref_denom is the reference denom for measuring arbitrage profit.
  // Only cycles ending in this denom will be considered for auto-execution.
  string arbitrage_ref_denom = 10
      [ (gogoproto.moretags) = "yaml:\"arbitrage_ref_denom\"" ];
}
