syntax = "proto3";
package dysonprotocol.whaleswap.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "google/protobuf/timestamp.proto";

option go_package = "dysonprotocol.com/x/whaleswap/types";

// ═════════════════════════════════
// Leverage State Types
// ═════════════════════════════════

enum LiquidationStatus {
  LIQUIDATION_STATUS_UNSPECIFIED = 0;
  LIQUIDATION_STATUS_NONE = 1;
  LIQUIDATION_STATUS_INITIALIZED = 2;
}

enum PositionStatus {
  POSITION_STATUS_UNSPECIFIED = 0;
  POSITION_STATUS_OPEN = 1;
  POSITION_STATUS_CLOSED = 2;
  POSITION_STATUS_LIQUIDATING = 3;
  POSITION_STATUS_LIQUIDATED = 4;
}

// LeveragePosition represents an active leverage position for a trader.
message LeveragePosition {
  uint64 position_id = 1;
  uint64 pool_id = 2;
  string user = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  PositionStatus status = 4;

  cosmos.base.v1beta1.Coin borrowed = 5 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin held = 6 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin collateral = 7 [ (gogoproto.nullable) = false ];
  uint64 created_height = 8;
  google.protobuf.Timestamp created_time = 9 [ (gogoproto.stdtime) = true ];
  uint64 liquidation_initialized_block_height = 10;
  LiquidationStatus liquidation_status = 11;

  // Unpaid interest carried forward from prior settlements (borrowed denom).
  cosmos.base.v1beta1.Coin accrued_interest = 12
      [ (gogoproto.nullable) = false ];

  uint64 updated_height = 13;
  google.protobuf.Timestamp updated_time = 14 [ (gogoproto.stdtime) = true ];

  // ═════ PER-POSITION SNAPSHOTS (sticky to this position) ═════
  // Annual interest rate for the borrowed denom (APR as LegacyDec string).
  cosmos.base.v1beta1.DecCoin interest_rate = 22
      [ (gogoproto.nullable) = false ];
  // Minimum collateral ratio used for health/liquidation checks (cosmos.Dec
  // string).
  string min_collateral_ratio = 23 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  // Liquidation threshold used for liquidation checks (cosmos.Dec string).
  string liquidation_threshold = 24 [ (cosmos_proto.scalar) = "cosmos.Dec" ];

  // Opening principal snapshot for analytics/limits (borrowed denom).
  cosmos.base.v1beta1.Coin initial_borrowed = 25
      [ (gogoproto.nullable) = false ];
  // Opening principal snapshot for analytics/limits (held denom).
  cosmos.base.v1beta1.Coin initial_held = 33 [ (gogoproto.nullable) = false ];
  // Opening principal snapshot for analytics/limits (collateral denom).
  cosmos.base.v1beta1.Coin initial_collateral = 34
      [ (gogoproto.nullable) = false ];
  // Lifetime interest paid by the user (borrowed denom).
  cosmos.base.v1beta1.Coin total_interest_paid = 26
      [ (gogoproto.nullable) = false ];
  // Timestamp of the last time interest was settled into accrued_interest.
  google.protobuf.Timestamp last_interest_settlement_time = 27
      [ (gogoproto.stdtime) = true ];
  // Fractional interest remainder (<1 borrowed coin) preserved between
  // settlements.
  cosmos.base.v1beta1.DecCoin accrued_interest_remainder = 28
      [ (gogoproto.nullable) = false ];

  // Trade IDs associated with this position over its lifetime.
  //
  // Semantics:
  // - Includes the opening trade that created the position.
  // - Includes all trades from partial and full closes.
  // - Includes trades from liquidation paths.
  // - Includes trades from MsgCoverPosition (covers) auto-close path.
  //
  // Values are whaleswap Trade.trade_id (uint64).
  repeated uint64 trade_ids = 29;

  // ═════ REALIZED P&L (PER POSITION) ═════
  // Cumulative realized profit from this position over its lifetime,
  // denominated in the borrowed denom. Includes:
  // - Profits from ClosePosition (full and partial closes)
  // - Profits from MsgCoverPosition auto-close path
  cosmos.base.v1beta1.Coin total_realized_profit = 30
      [ (gogoproto.nullable) = false ];

  // Cumulative realized loss from this position over its lifetime,
  // denominated in the borrowed denom. Includes:
  // - Losses realized in ClosePosition (full and partial closes)
  // - Losses realized during liquidation flows (if any)
  cosmos.base.v1beta1.Coin total_realized_loss = 31
      [ (gogoproto.nullable) = false ];

  // ═════ FINAL COLLATERAL RETURNED ═════
  // The amount of collateral returned to the user when the position was fully
  // closed. For partial closes, this accumulates the returned amount.
  cosmos.base.v1beta1.Coin collateral_returned = 32
      [ (gogoproto.nullable) = false ];
}
