syntax = "proto3";
package dysonprotocol.whaleswap.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "dysonprotocol/whaleswap/v1/params.proto";
import "dysonprotocol/whaleswap/v1/whaleswap.proto";
import "dysonprotocol/whaleswap/v1/leverage.proto";

option go_package = "dysonprotocol.com/x/whaleswap/types";

// GenesisState defines the whaleswap module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [ (gogoproto.nullable) = false ];

  // initial pools/offers/trades/auctions/positions
  repeated Pool pools = 2;
  repeated OfferData offers = 3;
  repeated Trade trades = 4;
  repeated AuctionRecord auctions = 5;
  repeated LeveragePosition positions = 6;
  repeated AddressMetrics address_metrics = 7;
}
