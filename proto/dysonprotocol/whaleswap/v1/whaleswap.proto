syntax = "proto3";
package dysonprotocol.whaleswap.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "dysonprotocol/whaleswap/v1/tx.proto";

option go_package = "dysonprotocol.com/x/whaleswap/types";

// Pool describes AMM pool state.
//
// Notes:
// - coin_a.denom < coin_b.denom lexicographically (canonical order)
// - fee_pct is a decimal string in [0,1)
// - min_price/max_price are optional decimal strings defining a price band over
//   P = coin_b.amount/coin_a.amount. If unset (or effectively [0, +∞)) the pool
//   behaves as constant-product (v2). If set, concentrated-liquidity math
//   applies.
// - coin_a.amount/coin_b.amount are sdk.Int strings.
// - The instantaneous price used by price-based queries is derived from
//   reserves as P = coin_b / coin_a, consistent with the notes above.
message Pool {
  uint64 pool_id = 1;
  // coins holds exactly two coins in canonical denom order (denom[0] <
  // denom[1]). All math derives price as P = coins[1].amount / coins[0].amount.
  repeated cosmos.base.v1beta1.Coin coins = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string shares_denom = 4;
  // fee_pct is the pool swap fee percentage (cosmos.Dec string in [0,1)).
  string fee_pct = 5 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  // min_price/max_price optionally set a price band for concentrated liquidity.
  // Each is expressed as exactly two coins representing the ratio
  // coins[1]/coins[0]. For example, [{amount: 1, denom: coins[0].denom},
  // {amount: 2, denom: coins[1].denom}] means Pmin = 2/1. Empty means unset.
  repeated cosmos.base.v1beta1.Coin min_price = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin max_price = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  uint64 block_height = 10;
  google.protobuf.Timestamp created = 11 [ (gogoproto.stdtime) = true ];
  google.protobuf.Timestamp updated = 12 [ (gogoproto.stdtime) = true ];
  uint64 num_trades = 13;
  // cumulative swap fees retained by the pool (accrue to LPs)
  repeated cosmos.base.v1beta1.Coin fees_earned = 14 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

// OfferData mirrors orderbook offer state.
//
// Status values: "open" | "closed" | "cancelled".
message OfferData {
  uint64 offer_id = 1;
  string status = 2; // "open" | "closed" | "cancelled"
  string maker = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 updated_height = 4;
  google.protobuf.Timestamp updated_timestamp = 5
      [ (gogoproto.stdtime) = true ];
  cosmos.base.v1beta1.Coin initial_have = 6 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin initial_want = 7 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin remaining_have = 8 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin remaining_want = 9 [ (gogoproto.nullable) = false ];
  string unit_have_int = 10;   // sdk.Int string
  string unit_want_int = 11;   // sdk.Int string
  string remaining_units = 12; // sdk.Int string
  // pfand_locked is the PFAND coin locked for liquid-mode offers.
  cosmos.base.v1beta1.Coin pfand_locked = 13 [ (gogoproto.nullable) = false ];
  // settlement_mode mirrors MsgMakeOffer.settlement_mode for this offer.
  dysonprotocol.whaleswap.v1.SettlementMode settlement_mode = 14;
}

// Trade captures a batch of operations executed atomically in a single message.
// Operations are stored in execution order, preserving the exact sequence from
// the original message (MsgMakeTrade, MsgPoolSwap, MsgTakeOffer,
// MsgRedeemAuction).
message Trade {
  uint64 trade_id = 1;
  string trader = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 height = 3;
  google.protobuf.Timestamp timestamp = 4 [ (gogoproto.stdtime) = true ];

  // Operations executed in this trade (from tx.proto TradeOperation).
  // Each operation records what was sent/received for that specific step.
  repeated TradeOperation operations = 5 [ (gogoproto.nullable) = false ];

  // Aggregated totals across all operations
  repeated cosmos.base.v1beta1.Coin total_sent = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin total_received = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];

  string note = 8;

  // Reserved field numbers from old schema (removed: offer_id, pool_id,
  // auction_id, sent, received)
  reserved 9, 10, 11, 12, 13, 14, 15;
}

// AuctionRecord stores metadata for a whaleswap-created auction escrow.
message AuctionRecord {
  uint64 auction_id = 1;
  string class_id = 2;
  string nft_id = 3;
  cosmos.base.v1beta1.Coin sell = 4 [ (gogoproto.nullable) = false ];
  string bid_denom = 5;
  string seller = 6 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// TradeMetrics reports the expected whaleswap module balances broken down by
// subsystem, and summary counters useful for monitoring and invariants.
message TradeMetrics {
  uint64 num_trades = 1;
  // Sum of reserves across all AMM pools
  repeated cosmos.base.v1beta1.Coin escrowed_pool_coins = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Sum of remaining_have over all open escrow-mode offers
  repeated cosmos.base.v1beta1.Coin escrowed_offer_coins = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Sum of pfand_locked over all open liquid-mode offers
  repeated cosmos.base.v1beta1.Coin escrowed_pfand = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Sum of auction sell escrows over all open auctions
  repeated cosmos.base.v1beta1.Coin escrowed_auction_coins = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Sum of fees_earned across all pools (accounted inside pool reserves)
  repeated cosmos.base.v1beta1.Coin fees_earned = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}
