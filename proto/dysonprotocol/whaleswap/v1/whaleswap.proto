syntax = "proto3";
package dysonprotocol.whaleswap.v1;

import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "dysonprotocol/whaleswap/v1/tx.proto";

option go_package = "dysonprotocol.com/x/whaleswap/types";

// Pool describes AMM pool state.
//
// Notes:
// - coin_a.denom < coin_b.denom lexicographically (canonical order)
// - fee_rate is a per-denom decimal rate in [0,1) as DecCoins
// - coin_a.amount/coin_b.amount are sdk.Int strings.
// - The instantaneous price used by price-based queries is derived from
//   reserves as P = coin_b / coin_a, consistent with the notes above.
message Pool {
  uint64 pool_id = 1;
  // coins holds exactly two coins in canonical denom order (denom[0] <
  // denom[1]). All math derives price as P = coins[1].amount / coins[0].amount.
  repeated cosmos.base.v1beta1.Coin coins = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  string shares_denom = 4;
  // Deprecated: fee_pct is the legacy pool swap fee percentage (cosmos.Dec
  // string in [0,1)). Use fee_rate field 25 instead. Migration logic should
  // read this and convert to fee_rate format (two DecCoins, one per reserve
  // denom in canonical order).
  string fee_pct = 5
      [ deprecated = true, (cosmos_proto.scalar) = "cosmos.Dec" ];
  // Deprecated legacy price band fields retained for decoding old genesis
  // exports. Migration logic ignores their values and clears them.
  repeated cosmos.base.v1beta1.Coin min_price = 6 [
    deprecated = true,
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated cosmos.base.v1beta1.Coin max_price = 7 [
    deprecated = true,
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Deprecated legacy fields for backward-compatible JSON decoding of old
  // genesis
  uint64 block_height = 10 [ deprecated = true ];
  google.protobuf.Timestamp created = 11
      [ deprecated = true, (gogoproto.stdtime) = true ];
  google.protobuf.Timestamp updated = 12
      [ deprecated = true, (gogoproto.stdtime) = true ];

  // New normalized fields
  uint64 created_height = 28;
  google.protobuf.Timestamp created_time = 29 [ (gogoproto.stdtime) = true ];
  google.protobuf.Timestamp updated_time = 30 [ (gogoproto.stdtime) = true ];
  uint64 updated_height = 27;
  uint64 num_trades = 13;
  // cumulative swap fees retained by the pool (accrue to LPs)
  repeated cosmos.base.v1beta1.Coin fees_earned = 14 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];

  // ═════ LEVERAGE FIELDS ═════
  // Annual interest rates per reserve denom (exactly two, canonical order).
  // Each amount is a decimal string representing APR (per-year accrual).
  repeated cosmos.base.v1beta1.DecCoin interest_rate = 15 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];

  // Total accrued interest (yield for LPs)
  repeated cosmos.base.v1beta1.Coin interest_earned = 19 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];

  // Total borrowed (aggregate for cap enforcement)
  repeated cosmos.base.v1beta1.Coin total_borrowed = 20 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];

  // ═════ PER-POOL LEVERAGE RISK PARAMETERS (per-denom) ═════
  // Minimum collateral ratio required at position open per reserve denom
  // (exactly two, canonical order). Each amount is a decimal string (> 1).
  repeated cosmos.base.v1beta1.DecCoin min_collateral_ratio = 21 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];

  // Deprecated: maximum leverage ratio per reserve denom.
  // This field is ignored by the keeper; risk is enforced via
  // min_collateral_ratio, liquidation_threshold, and max_borrow_percent.
  // Kept for backward-compatible JSON/proto decoding of older clients.
  repeated cosmos.base.v1beta1.DecCoin max_leverage_ratio = 22 [
    deprecated = true,
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];

  // Collateral ratio threshold below which position is liquidatable per reserve
  // denom (exactly two, canonical order). Each amount is a decimal string
  // (> 1).
  repeated cosmos.base.v1beta1.DecCoin liquidation_threshold = 23 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];

  // Maximum borrow capacity per reserve denom as DecCoins (exactly two,
  // canonical order). Each amount is a decimal in [0,1).
  repeated cosmos.base.v1beta1.DecCoin max_borrow_percent = 24 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];

  // Directional price-impact bounds keyed by the sold denom.
  // Each amount must satisfy 0 < x <= 1; x == 1 disables the bound (unbounded).
  // Missing entries default to 1 for both pool denoms. Stored in canonical pool
  // order (coins[0], coins[1]). During swaps, selling denom D enforces that the
  // post-trade price of D quoted in the opposite denom may drop by at most
  // x fraction (B = 1/(1-x) multiplier). Values outside (0,1] are rejected at
  // validation time.
  repeated cosmos.base.v1beta1.DecCoin bound_percent = 26 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];

  // fee_rate is the per-denom pool swap fee rate (amount in [0,1)), exactly two
  // entries in canonical pool order matching coins[0].denom and coins[1].denom.
  // Fee is applied to the OUTPUT denom of each swap leg: for exact-in, the
  // computed gross output is reduced by fee; for exact-out, the required gross
  // output is inflated so net (after fee) meets the target. Fees accrue to
  // fees_earned in the output denom.
  // Replaces deprecated fee_pct field 5.
  repeated cosmos.base.v1beta1.DecCoin fee_rate = 25 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];
}

// OfferData mirrors orderbook offer state.
//
// Status values: "open" | "closed" | "cancelled".
message OfferData {
  uint64 offer_id = 1;
  string status = 2; // "open" | "closed" | "cancelled"
  string maker = 3 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 updated_height = 4;
  // Deprecated for backward-compatible JSON decoding of old genesis
  google.protobuf.Timestamp updated_timestamp = 5
      [ deprecated = true, (gogoproto.stdtime) = true ];
  // New normalized timestamps
  uint64 created_height = 15;
  google.protobuf.Timestamp created_time = 16 [ (gogoproto.stdtime) = true ];
  google.protobuf.Timestamp updated_time = 17 [ (gogoproto.stdtime) = true ];
  cosmos.base.v1beta1.Coin initial_have = 6 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin initial_want = 7 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin remaining_have = 8 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin remaining_want = 9 [ (gogoproto.nullable) = false ];
  string unit_have_int = 10;   // sdk.Int string
  string unit_want_int = 11;   // sdk.Int string
  string remaining_units = 12; // sdk.Int string
  // pfand_locked is the PFAND coin locked for liquid-mode offers.
  cosmos.base.v1beta1.Coin pfand_locked = 13 [ (gogoproto.nullable) = false ];
  // settlement_mode mirrors MsgMakeOffer.settlement_mode for this offer.
  dysonprotocol.whaleswap.v1.SettlementMode settlement_mode = 14;
}

// Trade captures a batch of operations executed atomically in a single message.
// Operations are stored in execution order, preserving the exact sequence from
// the original message (MsgMakeTrade, MsgPoolSwap, MsgTakeOffer,
// MsgRedeemAuction).
message Trade {
  uint64 trade_id = 1;

  // ═════ DEPRECATED FIELDS (fields 2-10) - for migration compatibility ═════
  // These fields are kept for backwards compatibility. Migration logic should
  // read these and populate the new fields (20+) below.
  // Deprecated: use operations field 23 and trader field 20 instead
  uint64 offer_id = 2 [ deprecated = true ];
  // Deprecated: use trader field 20 instead
  string taker = 3
      [ deprecated = true, (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Deprecated: use height field 21 instead
  uint64 height_deprecated = 4 [ deprecated = true ];
  // Deprecated: use timestamp field 22 instead
  google.protobuf.Timestamp timestamp_deprecated = 5
      [ deprecated = true, (gogoproto.stdtime) = true ];
  // Deprecated: use total_sent field 24 instead
  cosmos.base.v1beta1.Coin sent = 6
      [ deprecated = true, (gogoproto.nullable) = false ];
  // Deprecated: use total_received field 25 instead
  cosmos.base.v1beta1.Coin received = 7
      [ deprecated = true, (gogoproto.nullable) = false ];
  // Deprecated: use operations field 23 to infer pool swaps
  uint64 pool_id = 8 [ deprecated = true ];
  // Deprecated: use operations field 23 to infer auction redemptions
  uint64 auction_id = 9 [ deprecated = true ];
  // Deprecated: use note field 26 instead
  string note_deprecated = 10 [ deprecated = true ];

  // Reserved field numbers 11-19 for future use
  reserved 11, 12, 13, 14, 15, 16, 17, 18, 19;

  // ═════ NEW FIELDS (fields 20+) ═════
  // Trader address (was taker in old schema, field 3)
  string trader = 20 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Block height when trade was executed (was field 4 in old schema)
  uint64 height = 21;
  // Timestamp when trade was executed (was field 5 in old schema)
  google.protobuf.Timestamp timestamp = 22 [ (gogoproto.stdtime) = true ];
  // Operations executed in this trade (from tx.proto TradeOperation).
  // Each operation records what was sent/received for that specific step.
  // Replaces offer_id/pool_id/auction_id fields (2, 8, 9) from old schema.
  repeated TradeOperation operations = 23 [ (gogoproto.nullable) = false ];
  // Aggregated totals across all operations (was single sent field 6)
  repeated cosmos.base.v1beta1.Coin total_sent = 24 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Aggregated totals across all operations (was single received field 7)
  repeated cosmos.base.v1beta1.Coin total_received = 25 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Optional note (was field 10 in old schema)
  string note = 26;
}

// AuctionRecord stores metadata for a whaleswap-created auction escrow.
message AuctionRecord {
  uint64 auction_id = 1;
  string class_id = 2;
  string nft_id = 3;
  cosmos.base.v1beta1.Coin sell = 4 [ (gogoproto.nullable) = false ];
  string bid_denom = 5;
  string seller = 6 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// TradeMetrics reports the expected whaleswap module balances broken down by
// subsystem, and summary counters useful for monitoring and invariants.
message TradeMetrics {
  uint64 num_trades = 1;
  // Sum of reserves across all AMM pools
  repeated cosmos.base.v1beta1.Coin escrowed_pool_coins = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Sum of remaining_have over all open escrow-mode offers
  repeated cosmos.base.v1beta1.Coin escrowed_offer_coins = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Sum of pfand_locked over all open liquid-mode offers
  repeated cosmos.base.v1beta1.Coin escrowed_pfand = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Sum of auction sell escrows over all open auctions
  repeated cosmos.base.v1beta1.Coin escrowed_auction_coins = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Sum of fees_earned across all pools (accounted inside pool reserves)
  repeated cosmos.base.v1beta1.Coin fees_earned = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}

// AddressMetrics aggregates lifetime whaleswap activity for a specific address.
// All metrics are cumulative totals, not current state snapshots.
//
// NOTE: Only coins with existing denom metadata are tracked to prevent spam
// and focus on relevant assets. Coins without metadata are excluded from all
// volume and balance aggregations.
message AddressMetrics {
  // Core identity
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  uint64 block_height = 2;

  // ═════ TRADING ═════
  // Total unique trades executed as trader
  uint64 total_trades = 10;
  // Total operations across all trades (swap legs + takes + auction redeems)
  uint64 total_trade_ops = 11;
  // Lifetime aggregate coins sent (denoms with metadata only)
  repeated cosmos.base.v1beta1.Coin total_volume_sent = 12 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Lifetime aggregate coins received (denoms with metadata only)
  repeated cosmos.base.v1beta1.Coin total_volume_received = 13 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];

  // ═════ LP ACTIVITY ═════
  // Total pools created by this address
  uint64 pools_created = 20;
  // Cumulative swap fees earned (denoms with metadata only)
  repeated cosmos.base.v1beta1.Coin lp_fees_earned = 21 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Cumulative interest earned from leverage borrowers (denoms with metadata
  // only)
  repeated cosmos.base.v1beta1.Coin lp_interest_earned = 22 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Count of liquidity add operations
  uint64 liquidity_adds = 23;
  // Count of liquidity remove operations
  uint64 liquidity_removes = 24;

  // ═════ LEVERAGE (BORROWER) ═════
  // Total leverage positions opened (lifetime)
  uint64 positions_opened = 30;
  // Total leverage positions closed (lifetime)
  uint64 positions_closed = 31;
  // Total interest paid (denoms with metadata only)
  repeated cosmos.base.v1beta1.Coin interest_paid = 32 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Net PnL from closed leverage positions (denoms with metadata only)
  repeated cosmos.base.v1beta1.Coin leverage_pnl = 33 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Count of positions liquidated (lifetime)
  uint64 liquidations = 34;

  // ═════ ORDERBOOK ═════
  // Total offers created (lifetime)
  uint64 offers_created = 40;
  // Total offers closed via full execution (lifetime)
  uint64 offers_closed = 41;
  // Total offers cancelled before completion (lifetime)
  uint64 offers_cancelled = 42;
  // Cumulative volume traded as maker (denoms with metadata only)
  repeated cosmos.base.v1beta1.Coin maker_volume = 43 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];

  // ═════ AUCTIONS ═════
  // Total auctions created as seller (lifetime)
  uint64 auctions_created = 50;
  // Total auction volume sold (denoms with metadata only)
  repeated cosmos.base.v1beta1.Coin auction_volume = 51 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
}
