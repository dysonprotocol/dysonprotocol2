syntax = "proto3";
package dysonprotocol.whaleswap.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "dysonprotocol/whaleswap/v1/whaleswap.proto";
import "dysonprotocol/whaleswap/v1/params.proto";

option go_package = "dysonprotocol.com/x/whaleswap/types";

// Query defines the gRPC querier service for whaleswap.
service Query {
  // Params queries the whaleswap module parameters
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/params";
  }

  // Pools
  rpc Pool(QueryPoolRequest) returns (QueryPoolResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/pools/{pool_id}";
  }
  rpc Pools(QueryPoolsRequest) returns (QueryPoolsResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/pools";
  }
  // PoolsByPair returns all pools matching the provided denom pair with
  // pagination. Denom order in the request is irrelevant.
  rpc PoolsByPair(QueryPoolsByPairRequest) returns (QueryPoolsByPairResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/pools/by_pair";
  }
  // PoolsByDenom returns all pools that include the provided denom on either
  // side of the pair. This leverages a reverse index keyed by denom.
  rpc PoolsByDenom(QueryPoolsByDenomRequest)
      returns (QueryPoolsByDenomResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/pools/by_denom";
  }
  // PoolBySharesDenom returns the pool that mints the provided shares denom.
  rpc PoolBySharesDenom(QueryPoolBySharesDenomRequest)
      returns (QueryPoolBySharesDenomResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/pools/by_shares";
  }
  // PoolsByPairPriceRange returns pools for a given pair whose instantaneous
  // price (derived from reserves, P = coin_b/coin_a) falls within the optional
  // [min_price, max_price] range. Prices are expressed as cosmos.Dec strings.
  // If neither bound is provided, it returns all pools for the pair.
  rpc PoolsByPairPriceRange(QueryPoolsByPairPriceRangeRequest)
      returns (QueryPoolsByPairPriceRangeResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/pools/by_pair_price";
  }
  // PoolsByOwner returns pools where the requested owner holds a non-zero
  // balance of pool shares. This may be implemented via a filtered scan unless
  // the application maintains a dedicated reverse index.
  rpc PoolsByOwner(QueryPoolsByOwnerRequest)
      returns (QueryPoolsByOwnerResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/pools/owner/{owner}";
  }

  // Offers
  rpc Offer(QueryOfferRequest) returns (QueryOfferResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/offers/{offer_id}";
  }
  rpc OffersByOwner(QueryOffersByOwnerRequest)
      returns (QueryOffersByOwnerResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/offers/owner/{owner}";
  }
  // Unified offers listing with optional filters and pagination
  rpc Offers(QueryOffersRequest) returns (QueryOffersResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/offers";
  }
  // OffersByDenom returns offers that mention the provided denom either as the
  // have or want side, depending on the optional role filter. When role is
  // unset or empty, both sides are considered.
  rpc OffersByDenom(QueryOffersByDenomRequest)
      returns (QueryOffersByDenomResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/offers/by_denom";
  }
  // OffersByPairPriceRange returns offers for a pair (order of have/want is
  // irrelevant; the implementation canonicalizes to pairKey) whose price lies
  // within the optional [min_price, max_price] range. Prices are cosmos.Dec
  // strings representing want-per-have (high-per-low orientation), so lower is
  // better for takers paying want to receive have.
  rpc OffersByPairPriceRange(QueryOffersByPairPriceRangeRequest)
      returns (QueryOffersByPairPriceRangeResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/offers/by_pair_price";
  }
  // OffersBest returns up to `limit` best-priced offers for the given pair
  // (treating price as want-per-have, sorted ascending). This is a convenience
  // endpoint for top-of-book queries.
  rpc OffersBest(QueryOffersBestRequest) returns (QueryOffersBestResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/offers/best";
  }

  // Trades
  // Get a single trade by id
  rpc Trade(QueryTradeRequest) returns (QueryTradeResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/{trade_id}";
  }
  // List trades with optional filters and pagination
  rpc Trades(QueryTradesRequest) returns (QueryTradesResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/trades";
  }
  rpc TradesByOffer(QueryTradesByOfferRequest)
      returns (QueryTradesByOfferResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/offer/{offer_id}";
  }
  rpc TradesByTaker(QueryTradesByTakerRequest)
      returns (QueryTradesByTakerResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/taker/{taker}";
  }
  // TradesByPool lists trades for an AMM pool
  rpc TradesByPool(QueryTradesByPoolRequest)
      returns (QueryTradesByPoolResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/pool/{pool_id}";
  }
  // TradesByAuction lists trades for auction redemptions
  rpc TradesByAuction(QueryTradesByAuctionRequest)
      returns (QueryTradesByAuctionResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/auction/{auction_id}";
  }

  // Auctions
  rpc Auction(QueryAuctionRequest) returns (QueryAuctionResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/auctions/{auction_id}";
  }
  // List auctions with optional filters and pagination
  rpc Auctions(QueryAuctionsRequest) returns (QueryAuctionsResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/auctions";
  }
  // AuctionsBySeller returns auctions opened by the specified seller address.
  rpc AuctionsBySeller(QueryAuctionsBySellerRequest)
      returns (QueryAuctionsBySellerResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/auctions/seller/{seller}";
  }
  // AuctionByNFT returns the auction associated with the specific NFT
  // (class_id, nft_id) used as the escrow marker.
  rpc AuctionByNFT(QueryAuctionByNFTRequest)
      returns (QueryAuctionByNFTResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/auctions/by_nft";
  }
  // AuctionsByPairPriceRange returns auctions for a given (sell,bid) pair whose
  // effective price (bid-per-sell) falls within [min_price, max_price].
  // IMPORTANT: This endpoint requires iterating relevant NFTs/auctions and
  // computing the current effective price from valuation or current bid and the
  // redeemable sell-coin amount. It is designed for UI discovery and may be
  // more expensive than index-backed queries.
  rpc AuctionsByPairPriceRange(QueryAuctionsByPairPriceRangeRequest)
      returns (QueryAuctionsByPairPriceRangeResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/auctions/by_pair_price";
  }

  // Metrics returns a breakdown of module-expected balances by subsystem
  // and summary counters for invariants and monitoring.
  rpc Metrics(QueryMetricsRequest) returns (QueryMetricsResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/metrics";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [ (gogoproto.nullable) = false ];
}

message QueryPoolRequest { uint64 pool_id = 1; }
message QueryPoolResponse { Pool pool = 1; }

message QueryPoolsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryPoolsResponse {
  repeated Pool pools = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// --- Pool extended queries ---

// QueryPoolByPairRequest selects a pool by denom pair regardless of order.
// The implementation canonicalizes the pair to a unique internal key.
message QueryPoolsByPairRequest {
  string base_denom = 1;  // base of the pair (price is quote/base)
  string quote_denom = 2; // quote of the pair
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

message QueryPoolsByPairResponse {
  repeated Pool pools = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryPoolsByDenomRequest lists pools containing the provided denom on either
// side.
message QueryPoolsByDenomRequest {
  string denom = 1; // any pool where coin_a==denom or coin_b==denom
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryPoolsByDenomResponse {
  repeated Pool pools = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryPoolBySharesDenomRequest selects the pool that mints the given shares
// denom.
message QueryPoolBySharesDenomRequest { string shares_denom = 1; }

message QueryPoolBySharesDenomResponse { Pool pool = 1; }

// QueryPoolsByPairPriceRangeRequest filters pools for the pair by instantaneous
// price range. Prices are cosmos.Dec strings; bounds are optional and
// inclusive.
message QueryPoolsByPairPriceRangeRequest {
  // Price is interpreted as quote/base using these fields
  string base_denom = 1;
  string quote_denom = 2;
  string min_price = 3 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  string max_price = 4 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  cosmos.base.query.v1beta1.PageRequest pagination = 5;
}

message QueryPoolsByPairPriceRangeResponse {
  repeated Pool pools = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryPoolsByOwnerRequest returns pools where the owner holds non-zero shares.
message QueryPoolsByOwnerRequest {
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryPoolsByOwnerResponse {
  repeated Pool pools = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOfferRequest { uint64 offer_id = 1; }
message QueryOfferResponse { OfferData offer = 1; }

message QueryOffersByOwnerRequest {
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string status = 2; // optional filter
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryOffersByOwnerResponse {
  repeated OfferData offers = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOffersRequest {
  // optional filters; if unset returns all
  string have_denom = 1;
  string want_denom = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryOffersResponse {
  repeated OfferData offers = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// --- Offer extended queries ---

// QueryOffersByDenomRequest lists offers that reference the provided denom.
// role = "have" restricts to have-denom; role = "want" restricts to want-denom;
// if empty or unset, both sides are included.
message QueryOffersByDenomRequest {
  string denom = 1;
  string role = 2; // "have" | "want" | ""
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

message QueryOffersByDenomResponse {
  repeated OfferData offers = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryOffersByPairPriceRangeRequest filters offers for a pair by price range.
// Prices are expressed as want-per-have (high-per-low orientation) cosmos.Dec
// strings.
message QueryOffersByPairPriceRangeRequest {
  string have_denom = 1;
  string want_denom = 2;
  string min_price = 3 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  string max_price = 4 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  cosmos.base.query.v1beta1.PageRequest pagination = 5;
}

message QueryOffersByPairPriceRangeResponse {
  repeated OfferData offers = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryOffersBestRequest fetches up to `limit` best-priced offers for a pair.
message QueryOffersBestRequest {
  string have_denom = 1;
  string want_denom = 2;
  uint32 limit = 3; // number of top offers to return
}

message QueryOffersBestResponse { repeated OfferData offers = 1; }

message QueryTradesRequest {
  // optional filters; if unset, returns all
  string sent_denom = 1;
  string received_denom = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryTradesResponse {
  repeated Trade trades = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTradesByOfferRequest {
  uint64 offer_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryTradesByOfferResponse {
  repeated Trade trades = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTradesByTakerRequest {
  string taker = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryTradesByTakerResponse {
  repeated Trade trades = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryTradesByPoolRequest returns trades filtered by pool id
message QueryTradesByPoolRequest {
  uint64 pool_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryTradesByPoolResponse {
  repeated Trade trades = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTradesByAuctionRequest {
  uint64 auction_id = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryTradesByAuctionResponse {
  repeated Trade trades = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTradeRequest { uint64 trade_id = 1; }
message QueryTradeResponse { Trade trade = 1; }

message QueryAuctionRequest { uint64 auction_id = 1; }
message QueryAuctionResponse { AuctionRecord auction = 1; }

message QueryAuctionsRequest {
  // optional filters; if unset, returns all
  string sell_denom = 1;
  string bid_denom = 2;
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryAuctionsResponse {
  repeated AuctionRecord auctions = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// --- Auction extended queries ---

// QueryAuctionsBySellerRequest lists auctions created by the seller address.
message QueryAuctionsBySellerRequest {
  string seller = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryAuctionsBySellerResponse {
  repeated AuctionRecord auctions = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryAuctionByNFTRequest selects an auction by the escrow NFT identity.
message QueryAuctionByNFTRequest {
  string class_id = 1;
  string nft_id = 2;
}

message QueryAuctionByNFTResponse { AuctionRecord auction = 1; }

// QueryAuctionsByPairPriceRangeRequest filters auctions by their effective
// price (bid-per-sell). Implementations may need to iterate candidate auctions
// and compute the price from valuation/current bid and redeemable sell amounts.
message QueryAuctionsByPairPriceRangeRequest {
  string sell_denom = 1;
  string bid_denom = 2;
  string min_price = 3 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  string max_price = 4 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  cosmos.base.query.v1beta1.PageRequest pagination = 5;
}

message QueryAuctionsByPairPriceRangeResponse {
  repeated AuctionRecord auctions = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryMetricsRequest {}
message QueryMetricsResponse { TradeMetrics metrics = 1; }
