// ═════════════════════════════════
// Leverage Queries
// ═════════════════════════════════

message QueryPositionRequest {
  // ID of the leverage position to retrieve
  uint64 position_id = 1;
}

// HealthStatus enum for position health
enum PositionHealthStatus {
  POSITION_HEALTH_STATUS_UNSPECIFIED = 0;
  POSITION_HEALTH_STATUS_HEALTHY = 1;
  POSITION_HEALTH_STATUS_AT_RISK = 2;
  POSITION_HEALTH_STATUS_LIQUIDATABLE = 3;
}

message QueryPositionResponse {
  LeveragePosition position = 1 [ (gogoproto.nullable) = false ];

  // Health Information
  PositionHealthStatus health_status = 2;
  string current_collateral_ratio = 3 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string liquidation_threshold = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string collateral_value = 5 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string debt_with_interest = 6 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  bool can_close_by_owner = 7;
  uint64 blocks_until_closeable = 8;
  bool can_initialize_liquidation = 9;
  bool can_finalize_liquidation = 10;

  InterestView interest = 11 [ (gogoproto.nullable) = false ];
}

message InterestView {
  // Decimal amount of interest owed right now (borrowed denom).
  string interest_due = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // Principal + interest as integer coin.
  cosmos.base.v1beta1.Coin total_repayment = 2 [ (gogoproto.nullable) = false ];
  // Seconds since the last settlement reference.
  uint64 time_elapsed = 3;
  // Annual rate applied for this position (borrowed denom entry).
  string annual_rate = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

message QueryPositionsByAddressRequest {
  // Account address to filter positions by; returns all positions owned by this
  // address.
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Optional filter by borrowed denomination
  string borrowed_denom = 2;
  // Optional filter by collateral denomination
  string collateral_denom = 3;
  // Optional filter by pool ID (cannot combine with borrowed/collateral denoms)
  uint64 pool_id = 4;
  // Standard pagination parameters; results ordered by position ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 5;
  // Optional filter by lifecycle status; defaults to OPEN positions
  PositionStatus status = 6;
}

message QueryPositionsByAddressResponse {
  // List of positions matching the address and filter criteria
  repeated LeveragePosition positions = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPositionsByPoolRequest {
  // Pool ID to filter positions by; returns all positions in this pool
  uint64 pool_id = 1;
  // Standard pagination parameters; results ordered by position ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
  // Optional filter by lifecycle status; defaults to OPEN positions
  PositionStatus status = 3;
}

message QueryPositionsByPoolResponse {
  // List of positions in the specified pool
  repeated LeveragePosition positions = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryAddressMetricsRequest {
  // Address to compute metrics for; must be a valid bech32 address
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

message QueryAddressMetricsResponse {
  // Comprehensive lifetime metrics for the specified address
  AddressMetrics metrics = 1 [ (gogoproto.nullable) = false ];
}

message QueryAddressMetricsAllRequest {
  // Standard pagination parameters; results ordered lexicographically by
  // address
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAddressMetricsAllResponse {
  // List of address metrics for all addresses in the system
  repeated AddressMetrics metrics = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// --- Arbitrage simulation ---

message QuerySimulateArbitrageRequest {
  // Trader address to use for simulation; must be a valid bech32 address
  string trader = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // List of denoms affected (e.g., from a pool update). Arbitrage detection
  // starts from pools containing these denoms.
  repeated string affected_denoms = 2;
  // Reference denom to measure profit in (typically the chain's base denom)
  string ref_denom = 3;
  // Number of hops to expand pool graph (0 = only direct pools, 1 = include
  // neighbor pools, etc.)
  int32 depth = 4;
  // Maximum fraction of pool reserve to swap (e.g., 0.1 = 10%)
  string max_fraction = 5 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  // Trigger trade inputs (coins sent in the triggering swap) - used to scale
  // probe bounds
  repeated cosmos.base.v1beta1.Coin trigger_inputs = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Trigger trade outputs (coins received from the triggering swap) - used to
  // scale probe bounds
  repeated cosmos.base.v1beta1.Coin trigger_outputs = 7 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Maximum path depth for FLOOD algorithm cycle search (default: 6)
  int32 max_depth = 8;
  // Maximum number of split iterations for FLOOD algorithm (default: 5)
  int32 max_splits = 9;
}

message QuerySimulateArbitrageResponse {
  // Whether a profitable arbitrage opportunity was found
  bool found = 1;
  // Number of pools in the arbitrage graph
  int32 pool_count = 2;
  // All denoms discovered in the pool graph
  repeated string denoms = 3;
  // Simulated profit in ref_denom (only if found=true)
  string profit = 4;
  // Net inputs the trader would need to provide (ideally empty for circular
  // arb)
  repeated cosmos.base.v1beta1.Coin trader_inputs = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Net outputs the trader would receive
  repeated cosmos.base.v1beta1.Coin trader_outputs = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  // Pool IDs in the arbitrage graph
  repeated uint64 pool_ids = 7;
  // Trade operations to execute (used by auto-arbitrage)
  repeated TradeOperation operations = 8 [ (gogoproto.nullable) = false ];
  // Trader address used in simulation
  string trader = 9 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}
