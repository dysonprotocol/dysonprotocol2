syntax = "proto3";
package dysonprotocol.whaleswap.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "dysonprotocol/whaleswap/v1/whaleswap.proto";
import "dysonprotocol/whaleswap/v1/leverage.proto";
import "dysonprotocol/whaleswap/v1/params.proto";
import "dysonprotocol/whaleswap/v1/tx.proto";

option go_package = "dysonprotocol.com/x/whaleswap/types";

// Query defines the gRPC querier service for whaleswap.
service Query {
  /*
   * Params queries the current whaleswap module parameters.
   *
   * Returns all module configuration values including fees, limits, and module
   * settings. No filtering or pagination supported (empty request accepted).
   */
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/params";
  }

  /*
   * Pool queries a single AMM pool by ID.
   *
   * Returns complete pool data including reserves, shares denom, and
   * configuration. Direct lookup by pool_id for fast retrieval.
   */
  rpc Pool(QueryPoolRequest) returns (QueryPoolResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/pool/{pool_id}";
  }
  /*
   * Pools lists all AMM pools with pagination.
   *
   * Returns all pools in the system with no filtering. Uses direct pagination
   * over the primary PoolsMap. Results ordered by pool ID ascending.
   */
  rpc Pools(QueryPoolsRequest) returns (QueryPoolsResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/pools/all";
  }
  /*
   * PoolsByPair queries all pools matching a denom pair with pagination.
   *
   * Returns pools containing exactly the specified denom pair, regardless of
   * order. Canonicalizes the pair internally for consistent lookup. Uses
   * filtered pagination over the primary PoolsMap. Results ordered by pool ID
   * ascending.
   */
  rpc PoolsByPair(QueryPoolsByPairRequest) returns (QueryPoolsByPairResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/pools/by_pair";
  }
  /*
   * PoolsByDenom queries all pools that include a specific denom on either
   * side.
   *
   * Returns pools where the specified denom appears in either coin position.
   * Uses filtered pagination over the primary PoolsMap. Results ordered by pool
   * ID ascending.
   */
  rpc PoolsByDenom(QueryPoolsByDenomRequest)
      returns (QueryPoolsByDenomResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/pools/by_denom";
  }
  /*
   * PoolBySharesDenom queries the pool that mints a specific shares denom.
   *
   * Returns the pool with matching shares_denom (expected to be unique).
   * Scans pools to find the matching one; uses unpaginated scan since shares
   * denoms are expected to be unique.
   */
  rpc PoolBySharesDenom(QueryPoolBySharesDenomRequest)
      returns (QueryPoolBySharesDenomResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/pools/by_shares";
  }
  /*
   * PoolsByPairPriceRange queries pools for a pair whose instantaneous price
   * falls within optional bounds.
   *
   * Filters pools by denom pair and price range (quote/base ratio from
   * reserves). Bounds are inclusive and optional; omitting both returns all
   * matching pairs. Uses filtered pagination over the primary PoolsMap. Results
   * ordered by pool ID ascending.
   */
  rpc PoolsByPairPriceRange(QueryPoolsByPairPriceRangeRequest)
      returns (QueryPoolsByPairPriceRangeResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/pools/by_pair_price";
  }
  /*
   * PoolsByOwner queries pools where the owner holds non-zero shares balance.
   *
   * Returns pools where the specified owner has a positive balance of pool
   * shares. Uses bank module balance checks for each pool's shares denom. Falls
   * back to filtered scan when no dedicated index exists. Results ordered by
   * pool ID ascending.
   */
  rpc PoolsByOwner(QueryPoolsByOwnerRequest)
      returns (QueryPoolsByOwnerResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/pools/by_owner/{owner}";
  }

  /*
   * Offer queries a single offer by ID.
   *
   * Returns offer data including maker, amounts, status, and timestamps.
   * Direct lookup by offer_id for fast retrieval.
   */
  rpc Offer(QueryOfferRequest) returns (QueryOfferResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/offer/{offer_id}";
  }
  /*
   * OffersByOwner queries offers by owner address with optional status filter.
   *
   * Returns offers owned by the specified address, optionally filtered by
   * status. Uses indexed queries when both owner and status provided for
   * optimal performance. Falls back to filtered scans for partial filters to
   * avoid nil entries. Supports pagination with consistent ordering by offer
   * ID.
   */
  rpc OffersByOwner(QueryOffersByOwnerRequest)
      returns (QueryOffersByOwnerResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/offers/by_owner/{owner}";
  }
  /*
   * Offers provides unified offer listing with optional denom filters and
   * pagination.
   *
   * Supports multiple query patterns based on provided filters for optimal
   * performance: both denoms (pair+price index), single have_denom, single
   * want_denom, or no filters. Canonicalizes pairs for consistent indexing and
   * ordering. Supports pagination with consistent ordering by offer ID.
   */
  rpc Offers(QueryOffersRequest) returns (QueryOffersResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/offers";
  }
  /*
   * OffersByDenom queries offers that reference a specific denom either as have
   * or want side.
   *
   * Returns offers where the specified denom appears in either have_denom or
   * want_denom. Uses role filter to restrict to "have" side, "want" side, or
   * both (when empty). Leverages OffersByHave and OffersByWant indices when
   * role specified for efficiency. Falls back to filtered scan over primary
   * OffersMap when role unspecified. Supports pagination with consistent
   * ordering by offer ID.
   */
  rpc OffersByDenom(QueryOffersByDenomRequest)
      returns (QueryOffersByDenomResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/offers/by_denom";
  }
  /*
   * OffersByPairPriceRange queries offers for a pair whose price lies within
   * optional bounds.
   *
   * Filters offers by denom pair and price range (want-per-have ratio).
   * Canonicalizes pair for consistent indexing; bounds are inclusive and
   * optional. Uses OffersByPairPrice index for efficient ordered scanning.
   * Supports pagination with ordering by price ascending.
   */
  rpc OffersByPairPriceRange(QueryOffersByPairPriceRangeRequest)
      returns (QueryOffersByPairPriceRangeResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/offers/by_pair_price";
  }
  /*
   * OffersBest returns up to limit best-priced offers for a pair (convenience
   * endpoint).
   *
   * Returns top offers for a pair sorted by price (want-per-have, ascending =
   * best for takers). Canonicalizes pair for indexing; applies limit
   * (defaulting to 10) via pagination. Uses OffersByPairPrice index for
   * efficient ordered retrieval.
   */
  rpc OffersBest(QueryOffersBestRequest) returns (QueryOffersBestResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/offers/best";
  }

  /*
   * Trade queries a single trade by ID.
   *
   * Returns complete trade data including participants, amounts, and
   * operations. Direct lookup by trade_id for fast retrieval.
   */
  rpc Trade(QueryTradeRequest) returns (QueryTradeResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/{trade_id}";
  }
  /*
   * Trades lists trades with optional denom filters and pagination.
   *
   * Returns trades filtered by sent_denom and/or received_denom if specified.
   * Uses filtered pagination over primary TradesMap for flexibility. Checks
   * TotalSent and TotalReceived coin arrays for denom presence.
   * Supports pagination with consistent ordering by trade ID.
   */
  rpc Trades(QueryTradesRequest) returns (QueryTradesResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/trades";
  }
  /*
   * TradesByOffer queries all trades involving a specific offer.
   *
   * Returns all trades where the specified offer_id appears as a participant.
   * Uses TradesByOfferIndex with (offer_id, trade_id) keys for efficient
   * lookup. Applies prefix filtering to iterate only trades for the specified
   * offer. Supports pagination with consistent ordering by trade ID.
   */
  rpc TradesByOffer(QueryTradesByOfferRequest)
      returns (QueryTradesByOfferResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/offer/{offer_id}";
  }
  /*
   * TradesByTaker queries all trades executed by a specific taker address.
   *
   * Returns all trades where the specified address appears as the taker
   * (trader). Uses TradesByTraderIndex with (trader_address, trade_id) keys for
   * efficient lookup. Applies prefix filtering to iterate only trades for the
   * specified trader. Supports pagination with consistent ordering by trade ID.
   */
  rpc TradesByTaker(QueryTradesByTakerRequest)
      returns (QueryTradesByTakerResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/taker/{taker}";
  }
  /*
   * TradesByPool queries all trades involving a specific AMM pool.
   *
   * Returns all trades where the specified pool_id appears as a participant.
   * Uses TradesByPoolIndex with (pool_id, trade_id) keys for efficient lookup.
   * Applies prefix filtering to iterate only trades for the specified pool.
   * Supports pagination with consistent ordering by trade ID.
   */
  rpc TradesByPool(QueryTradesByPoolRequest)
      returns (QueryTradesByPoolResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/pool/{pool_id}";
  }
  /*
   * TradesByAuction queries all trades involving auction redemptions for a
   * specific auction.
   *
   * Returns all trades where the specified auction_id appears as a participant.
   * Uses TradesByAuctionIndex with (auction_id, trade_id) keys for efficient
   * lookup. Applies prefix filtering to iterate only trades for the specified
   * auction. Supports pagination with consistent ordering by trade ID.
   */
  rpc TradesByAuction(QueryTradesByAuctionRequest)
      returns (QueryTradesByAuctionResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/trades/auction/{auction_id}";
  }

  /*
   * Auction queries a single auction by ID.
   *
   * Returns complete auction data including escrow details, bids, and NFT
   * markers. Direct lookup by auction_id for fast retrieval.
   */
  rpc Auction(QueryAuctionRequest) returns (QueryAuctionResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/auctions/{auction_id}";
  }
  /*
   * Auctions provides unified auction listing with optional denom filters and
   * pagination.
   *
   * Supports multiple query patterns based on provided filters for optimal
   * performance: both denoms (pair index), single sell_denom, single bid_denom,
   * or no filters. Applies appropriate prefix filtering to optimize index
   * usage. Supports pagination with consistent ordering by auction ID.
   */
  rpc Auctions(QueryAuctionsRequest) returns (QueryAuctionsResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/auctions";
  }
  /*
   * AuctionsBySeller queries auctions created by a specific seller address.
   *
   * Returns auctions where the specified address appears as the seller.
   * Uses filtered pagination over primary AuctionsMap (no dedicated index
   * assumed). Results ordered by auction ID ascending.
   */
  rpc AuctionsBySeller(QueryAuctionsBySellerRequest)
      returns (QueryAuctionsBySellerResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/auctions/seller/{seller}";
  }
  /*
   * AuctionByNFT queries the auction associated with specific NFT escrow
   * markers.
   *
   * Returns the auction where the specified class_id and nft_id appear as
   * escrow markers. Scans auctions to find matching NFT identifiers (expected
   * to be unique). Uses unpaginated scan since NFT markers should be unique per
   * auction.
   */
  rpc AuctionByNFT(QueryAuctionByNFTRequest)
      returns (QueryAuctionByNFTResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/auctions/by_nft";
  }
  /*
   * AuctionsByPairPriceRange queries auctions for a pair whose effective price
   * falls within bounds.
   *
   * Filters auctions by sell/bid denom pair using AuctionsBySellBid index.
   * Applies prefix filtering to iterate only auctions for the specified pair.
   * Price filtering is placeholder (marked as TODO in implementation).
   * Supports pagination with consistent ordering by auction ID.
   */
  rpc AuctionsByPairPriceRange(QueryAuctionsByPairPriceRangeRequest)
      returns (QueryAuctionsByPairPriceRangeResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/auctions/by_pair_price";
  }

  /*
   * Position queries a leverage position by ID and includes comprehensive
   * health and interest information.
   *
   * Retrieves complete position data including collateral, debt, and status.
   * Computes real-time interest accrual based on elapsed time and rates.
   * Calculates current collateral ratio and liquidation health status.
   * Determines action permissions: close by owner, initialize/finalize
   * liquidation. Returns enriched position data with computed fields for UI
   * consumption.
   */
  rpc Position(QueryPositionRequest) returns (QueryPositionResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/positions/{position_id}";
  }
  /*
   * PositionsByAddress lists all leverage positions for an address with
   * optional filters.
   *
   * Uses indexed queries on PositionsByAddressIndex with
   * (address,status,position_id) keys. Defaults to OPEN positions when status
   * unspecified. Applies additional filters for pool_id, borrowed_denom,
   * collateral_denom as specified. Supports pagination with consistent ordering
   * by position ID.
   */
  rpc PositionsByAddress(QueryPositionsByAddressRequest)
      returns (QueryPositionsByAddressResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/positions/address/{address}";
  }
  /*
   * PositionsByPool lists all leverage positions in a specific pool with
   * optional status filter.
   *
   * Uses indexed queries on PositionsByPoolIndex with
   * (pool_id,status,position_id) keys. Defaults to OPEN positions when status
   * unspecified. Filters positions by the specified pool_id. Supports
   * pagination with consistent ordering by position ID.
   */
  rpc PositionsByPool(QueryPositionsByPoolRequest)
      returns (QueryPositionsByPoolResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/positions/pool/{pool_id}";
  }

  /*
   * Metrics computes comprehensive module metrics including escrow balances and
   * trade statistics.
   *
   * Aggregates escrow balances: AMM pool reserves, offer-locked coins, PFAND
   * requirements. Counts auctions across all records by summing sell amounts.
   * Calculates total fees earned across all pools. Counts total trades by
   * iterating the trades map. Returns consolidated TradeMetrics for monitoring
   * and invariants checking.
   */
  rpc Metrics(QueryMetricsRequest) returns (QueryMetricsResponse) {
    option (google.api.http).get = "/dysonprotocol/whaleswap/v1/metrics";
  }

  /*
   * AddressMetrics computes lifetime activity metrics for a specific address.
   *
   * Aggregates all whaleswap activity for the address across trading, LP
   * operations, leverage positions, orderbook offers, and auctions. Only tracks
   * coins with registered denom metadata to prevent spam. All metrics are
   * cumulative lifetime totals computed at query time. Returns zero values for
   * addresses with no activity.
   */
  rpc AddressMetrics(QueryAddressMetricsRequest)
      returns (QueryAddressMetricsResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/metrics/address/{address}";
  }

  /*
   * AddressMetricsAll lists all stored address metrics with pagination.
   *
   * Iterates the AddressMetrics map in key order and returns the aggregated
   * metrics for every known address. Supports standard pagination to avoid
   * exhausting gRPC limits. Only use this endpoint for analytics dashboards or
   * invariants; it can be expensive on large datasets.
   */
  rpc AddressMetricsAll(QueryAddressMetricsAllRequest)
      returns (QueryAddressMetricsAllResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/metrics/addresses";
  }

  /*
   * SimulateArbitrage tests arbitrage detection for given affected denoms.
   *
   * This query simulates arbitrage opportunity detection without executing
   * trades. It builds a pool graph starting from the affected denoms, expands
   * by depth hops, runs the optimizer to find profitable circular swaps, and
   * returns the simulated result. Useful for testing arbitrage detection logic
   * and understanding potential opportunities. All simulations use CacheContext
   * so no state is modified.
   */
  rpc SimulateArbitrage(QuerySimulateArbitrageRequest)
      returns (QuerySimulateArbitrageResponse) {
    option (google.api.http).get =
        "/dysonprotocol/whaleswap/v1/simulate_arbitrage";
  }
}

message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1 [ (gogoproto.nullable) = false ];
}

message QueryPoolRequest {
  // ID of the pool to retrieve
  uint64 pool_id = 1;
}
message QueryPoolResponse {
  // The requested pool data
  Pool pool = 1;
}

message QueryPoolsRequest {
  // Standard pagination parameters for listing pools
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryPoolsResponse {
  // List of pools matching the query criteria
  repeated Pool pools = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// --- Pool extended queries ---

message QueryPoolsByPairRequest {
  // Base denom of the pair (price is quote/base); order with quote_denom is
  // irrelevant
  string base_denom = 1;
  // Quote denom of the pair; combined with base_denom forms the trading pair
  string quote_denom = 2;
  // Standard pagination parameters; results ordered by pool ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

message QueryPoolsByPairResponse {
  // List of pools containing the exact denom pair, ordered by pool ID
  repeated Pool pools = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPoolsByDenomRequest {
  // Denomination to search for; returns pools where this denom appears on
  // either side
  string denom = 1;
  // Standard pagination parameters; results ordered by pool ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryPoolsByDenomResponse {
  // List of pools containing the specified denom on either side
  repeated Pool pools = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPoolBySharesDenomRequest {
  // Shares denomination to find the corresponding pool for
  string shares_denom = 1;
}

message QueryPoolBySharesDenomResponse {
  // The pool that mints the specified shares denomination
  Pool pool = 1;
}

message QueryPoolsByPairPriceRangeRequest {
  // Base denom of the pair (price is quote/base); order with quote_denom is
  // irrelevant
  string base_denom = 1;
  // Quote denom of the pair; combined with base_denom forms the trading pair
  string quote_denom = 2;
  // Minimum price threshold as cosmos.Dec string (optional, inclusive)
  string min_price = 3 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  // Maximum price threshold as cosmos.Dec string (optional, inclusive)
  string max_price = 4 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  // Standard pagination parameters; results ordered by pool ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 5;
}

message QueryPoolsByPairPriceRangeResponse {
  // List of pools within the specified price range, ordered by pool ID
  repeated Pool pools = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPoolsByOwnerRequest {
  // Owner address to filter pools by; must be a valid bech32 address
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Standard pagination parameters; results ordered by pool ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryPoolsByOwnerResponse {
  // List of pools where the owner holds non-zero shares balance
  repeated Pool pools = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOfferRequest {
  // ID of the offer to retrieve
  uint64 offer_id = 1;
}
message QueryOfferResponse {
  // The requested offer data
  OfferData offer = 1;
}

message QueryOffersByOwnerRequest {
  // Owner address to filter offers by; must be a valid bech32 address
  string owner = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Optional status filter; valid values are "open", "closed", "cancelled"
  // If empty, returns offers with any status. Enables indexed queries when
  // combined with owner.
  string status = 2;
  // Standard pagination parameters; results ordered by offer ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryOffersByOwnerResponse {
  // List of offers matching the owner and status criteria, ordered by offer ID
  repeated OfferData offers = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOffersRequest {
  // Optional have denom filter; restricts to offers selling this denomination
  string have_denom = 1;
  // Optional want denom filter; restricts to offers buying this denomination
  string want_denom = 2;
  // Standard pagination parameters; results ordered by offer ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryOffersResponse {
  // List of offers matching the denom filters
  repeated OfferData offers = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// --- Offer extended queries ---

message QueryOffersByDenomRequest {
  // Denomination to search for in offers
  string denom = 1;
  // Role filter: "have" restricts to have-denom, "want" restricts to
  // want-denom, empty string includes both sides
  string role = 2;
  // Standard pagination parameters; results ordered by offer ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}

message QueryOffersByDenomResponse {
  // List of offers referencing the specified denomination
  repeated OfferData offers = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOffersByPairPriceRangeRequest {
  // Have denom of the pair (denomination being sold)
  string have_denom = 1;
  // Want denom of the pair (denomination being bought)
  string want_denom = 2;
  // Minimum price threshold as want-per-have cosmos.Dec string (optional,
  // inclusive)
  string min_price = 3 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  // Maximum price threshold as want-per-have cosmos.Dec string (optional,
  // inclusive)
  string max_price = 4 [ (cosmos_proto.scalar) = "cosmos.Dec" ];
  // Standard pagination parameters; results ordered by price ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 5;
}

message QueryOffersByPairPriceRangeResponse {
  // List of offers within the specified price range, ordered by price
  repeated OfferData offers = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOffersBestRequest {
  // Have denom of the pair (denomination being sold)
  string have_denom = 1;
  // Want denom of the pair (denomination being bought)
  string want_denom = 2;
  // Maximum number of best-priced offers to return (default: 10)
  uint32 limit = 3;
}

message QueryOffersBestResponse {
  // Up to limit best-priced offers for the pair, ordered by price ascending
  repeated OfferData offers = 1;
}

message QueryTradesRequest {
  // Optional sent denom filter; restricts to trades where this denom was sent
  string sent_denom = 1;
  // Optional received denom filter; restricts to trades where this denom was
  // received
  string received_denom = 2;
  // Standard pagination parameters; results ordered by trade ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 3;
}
message QueryTradesResponse {
  // List of trades matching the denom filters
  repeated Trade trades = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTradesByOfferRequest {
  // Offer ID to filter trades by; returns all trades involving this offer
  uint64 offer_id = 1;
  // Standard pagination parameters; results ordered by trade ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryTradesByOfferResponse {
  // List of trades involving the specified offer
  repeated Trade trades = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTradesByTakerRequest {
  // Taker address to filter trades by; returns all trades executed by this
  // address
  string taker = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Standard pagination parameters; results ordered by trade ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryTradesByTakerResponse {
  // List of trades executed by the specified taker
  repeated Trade trades = 1;
  // Pagination metadata for result set navigation
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryTradesByPoolRequest {
  // Pool ID to filter trades by; returns all trades involving this AMM pool
  uint64 pool_id = 1;
  // Standard pagination parameters; results ordered by trade ID ascending
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

