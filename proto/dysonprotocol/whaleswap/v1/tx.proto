syntax = "proto3";
package dysonprotocol.whaleswap.v1;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos/bank/v1beta1/bank.proto";
import "cosmos/msg/v1/msg.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";
import "dysonprotocol/whaleswap/v1/params.proto";
import "dysonprotocol/whaleswap/v1/leverage.proto";

option go_package = "dysonprotocol.com/x/whaleswap/types";

//
// Conventions used across whaleswap messages:
//
// - Denom pair canonicalization: Internally, any denom pair is ordered
//   lexicographically as pairKey = min(denom1, denom2) | max(denom1, denom2).
//   Callers may provide denoms in any order; the keeper normalizes.
//
// - Price orientation: Unless otherwise stated, price is expressed as
//   want-per-have in the high-per-low orientation relative to the canonical
//   pair: P = (amount of high denom) / (amount of low denom). This choice makes
//   lexicographic ordering of fixed-precision decimal strings align with
//   numeric ordering for indexes and range scans.
//
// - Decimal fields: cosmos.Dec are encoded as strings; callers MUST provide
//   syntactically valid decimal strings, and the keeper validates ranges.
//
// - Coins arrays in price bands: When used to express a ratio, the field must
//   be either empty (unset) or contain exactly two coins whose denoms match the
//   pool's reserve denoms, representing coin_b / coin_a.
//
// - Settlement modes: Orderbook offers specify how the 'have' is funded:
//   ESCROW (escrow base have at creation) or LIQUID (no escrow; lock PFAND and
//   settle from maker balance at take).
//
// Msg defines the whaleswap Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  /**
   * CreatePool creates a two-asset pool with per-denom fee/interest/leverage
   * parameters and optional directional bound_percent limits.
   *
   * Behavior:
   * - Input normalization: canonicalizes `coins` (exactly two positive coins)
   *   to the pool's denom order.
   * - Fees and rates: normalizes `fee_rate` and `interest_rate` to exactly two
   *   DecCoins in pool order; requires 0 <= fee_rate < 1 per denom and
   *   interest_rate >= 0 per denom.
   * - Leverage configuration: `min_collateral_ratio` (required) and
   *   `max_leverage_ratio` (deprecated; accepted for backward compatibility and
   *   ignored by the server). `liquidation_threshold` (required).
   * - `max_borrow_percent` (required) must have exactly two entries with
   * amounts in [0,1).
   * - Bound percent (optional): when omitted defaults to 1 (unbounded) for both
   *   denoms. When provided, must contain exactly two DecCoins matching pool
   *   denoms with amounts in (0,1]; 1 disables the bound for that denom.
   * - Funds and shares: sends initial reserves from `creator` → module;
   *   allocates a new pool_id; persists the pool; computes initial shares as
   *   floor(sqrt(x*y)); ensures at least one share; mints pool shares and sends
   *   them to the creator.
   * - Invariants: asserts AMM and module invariants before returning.
   *
   * Validation:
   * - coins must contain exactly two positive coins with valid denoms.
   * - fee_rate amounts must satisfy 0 <= x < 1 for both denoms when provided.
   * - interest_rate amounts must be >= 0 for both denoms when provided.
   * - min_collateral_ratio must have exactly two entries (> 1) matching pool
   *   denoms in canonical order.
   * - liquidation_threshold must have exactly two entries (> 1) matching pool
   *   denoms in canonical order.
   * - max_borrow_percent must have exactly two entries with amounts in [0,1)
   *   matching pool denoms in canonical order.
   * - bound_percent when provided must contain at most two entries with amounts
   *   in (0,1] matching pool denoms.
   *
   * Emits:
   * - EventPoolCreated(pool_id)
   * - EventPoolUpdate(pool_id)
   *
   * Returns:
   * - pool_id of the newly created pool (see response).
   */
  rpc CreatePool(MsgCreatePool) returns (MsgCreatePoolResponse);

  /**
   * UpdatePoolConfig updates pool fees, leverage/threshold params, interest,
   * optional max_borrow_percent, and bound_percent; majority-owner only.
   *
   * Behavior:
   * - Loads pool; validates signer and majority-ownership.
   * - Fee rates: optional; normalizes to two DecCoins (pool order); 0 <= x < 1.
   * - Leverage config: required `min_collateral_ratio` and `max_leverage_ratio`
   *   with exactly two entries matching pool denoms; each > 1.
   * - Liquidation threshold: required with exactly two entries; each > 1.
   * - Interest rate: allows 0/1/2 entries; normalizes to two; each >= 0.
   * - Max borrow percent: optional; if provided exactly two entries; 0 <= x
   * < 1.
   * - Bound percent: optional; when provided must contain exactly two DecCoins
   *   matching pool denoms with amounts in (0,1]; 1 disables the bound. Omit to
   *   leave existing bounds unchanged.
   * - Persists pool with `updated` timestamp; emits EventPoolUpdate; asserts
   * AMM and module invariants.
   *
   * Validation:
   * - Pool must exist.
   * - Signer must be valid address and hold majority of pool shares.
   * - Fee rates when provided must satisfy 0 <= x < 1 for both denoms.
   * - Leverage config (min_collateral_ratio, max_leverage_ratio) must have
   *   exactly two entries (> 1) matching pool denoms in canonical order.
   * - Liquidation threshold must have exactly two entries (> 1) matching pool
   *   denoms in canonical order.
   * - Interest rates when provided must be >= 0 for both denoms.
   * - Max borrow percent when provided must have exactly two entries with
   * amounts in [0,1) matching pool denoms in canonical order.
   * - Bound percent when provided must contain at most two entries with amounts
   *   in (0,1] matching pool denoms.
   *
   * Emits:
   * - EventPoolUpdate(pool_id)
   *
   * Returns:
   * - Empty response.
   */
  rpc UpdatePoolConfig(MsgUpdatePoolConfig)
      returns (MsgUpdatePoolConfigResponse);

  /**
   * AddLiquidity (owner-only) escrows provided amounts, refunds any unused
   * amounts, mints shares, and asserts AMM invariants.
   *
   * Behavior:
   * - Loads pool; validates signer majority ownership.
   * - Escrows full provided amounts first, then refunds unused surplus.
   * - Computes shares as floor(min(add1/R1, add2/R2) × totalShares).
   * - Updates pool reserves with used amounts.
   * - Mints computed shares via nameservice and transfers to signer.
   * - Persists pool with updated reserves/timestamp; emits events; asserts AMM
   *   and module invariants.
   *
   * Validation:
   * - Pool must exist and have exactly two positive reserves.
   * - Signer must be valid address and hold majority of pool shares.
   * - Amounts must contain exactly two positive coins matching pool denoms in
   *   canonical order.
   *
   * Emits:
   * - EventPoolUpdate (after persisting pool state)
   * - EventPoolLiquidityAdded (pool_id, shares_minted)
   */
  rpc AddLiquidity(MsgAddLiquidity) returns (MsgAddLiquidityResponse);

  /**
   * RemoveLiquidity burns the caller's shares and returns the underlying
   * reserves proportional to the share burned.
   */
  rpc RemoveLiquidity(MsgRemoveLiquidity) returns (MsgRemoveLiquidityResponse);

  /**
   * PoolSwap executes one or more exact-in or exact-out pool swap legs with a
   * single end-of-tx settlement. Applies output-side fees per leg and enforces
   * aggregate max_input caps and min_output guarantees.
   */
  rpc PoolSwap(MsgPoolSwap) returns (MsgPoolSwapResponse);

  /**
   * MakeTrade combines AMM pool swaps and orderbook takes into a single
   * transaction with end-of-tx settlement.
   */
  rpc MakeTrade(MsgMakeTrade) returns (MsgMakeTradeResponse);

  /**
   * MakeOffer creates an orderbook offer. ESCROW: base "have" is escrowed.
   * LIQUID: lock PFAND; settlement draws from maker balance at take. Units are
   * derived via GCD for partial fills.
   */
  rpc MakeOffer(MsgMakeOffer) returns (MsgMakeOfferResponse);

  /**
   * TakeOffer executes one or more orderbook takes with netting and settlement.
   */
  rpc TakeOffer(MsgTakeOffer) returns (MsgTakeOfferResponse);

  /**
   * CancelOffer (maker or authorized third party) cancels an open offer and
   * refunds escrowed assets to the maker while releasing PFAND to the closer.
   */
  rpc CancelOffer(MsgCancelOffer) returns (MsgCancelOfferResponse);

  /**
   * OpenAuction escrows the sell coin and mints an NFT under a class keyed by
   * bid_denom; class policy (listing/valuation/bid timeouts/allowed denoms) is
   * set from module params.
   */
  rpc OpenAuction(MsgOpenAuction) returns (MsgOpenAuctionResponse);

  /**
   * RedeemAuction lets the current NFT owner redeem when no bid is active;
   * burns the NFT and returns escrow. If owner != original seller and a
   * valuation exists in bid_denom, a trade record is emitted.
   */
  rpc RedeemAuction(MsgRedeemAuction) returns (MsgRedeemAuctionResponse);

  /**
   * OpenPosition creates a leveraged position by borrowing against collateral,
   * swapping to held asset, and recording the position with interest snapshots.
   */
  rpc OpenPosition(MsgOpenPosition) returns (MsgOpenPositionResponse);

  /**
   * ClosePosition swaps held to borrowed, repays principal+interest, returns
   * remaining collateral and any profit, updates pool accounting, and deletes
   * the position (respects block delay).
   */
  rpc ClosePosition(MsgClosePosition) returns (MsgClosePositionResponse);

  /**
   * AddCollateral deposits additional collateral to a leveraged position and
   * clears liquidation markers.
   */
  rpc AddCollateral(MsgAddCollateral) returns (MsgAddCollateralResponse);

  /**
   * CoverPosition repays accrued interest; optionally reduces principal or
   * auto-closes on full repayment.
   */
  rpc CoverPosition(MsgCoverPosition) returns (MsgCoverPositionResponse);

  /**
   * InitializeLiquidation (permissionless) marks a position liquidatable when
   * its collateral ratio (with accrued interest at the snapshotted rate) falls
   * below the pool's liquidation_threshold and starts the block-delay
   * countdown.
   */
  rpc InitializeLiquidation(MsgInitializeLiquidation)
      returns (MsgInitializeLiquidationResponse);

  /**
   * FinalizeLiquidation (permissionless) completes leveraged position
   * liquidation.
   */
  rpc FinalizeLiquidation(MsgFinalizeLiquidation)
      returns (MsgFinalizeLiquidationResponse);

  /**
   * UpdateParams (authority-only) updates module parameters.
   */
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// SettlementMode selects how offers fund the "have" side:
// - ESCROW: Escrow base have in the module at offer creation.
// - LIQUID: Do not escrow base; lock PFAND and settle from maker balance at
// take.
enum SettlementMode {
  SETTLEMENT_ESCROW = 0;
  SETTLEMENT_LIQUID = 1;
}

/*
 * MsgCreatePool
 */
message MsgCreatePool {
  option (cosmos.msg.v1.signer) = "creator";
  // Account creating the pool; receives the initial minted shares.
  string creator = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Initial reserves. Required: exactly two coins with positive amounts.
  // Order is canonicalized internally to pool denom order (lexicographic).
  repeated cosmos.base.v1beta1.Coin coins = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  reserved 3, 4;
  reserved "min_price", "max_price";
  // Deprecated: fee_pct is the legacy pool swap fee percentage (cosmos.Dec
  // string in [0,1)). Use fee_rate field 11 instead. Migration logic should
  // read this and convert to fee_rate format (two DecCoins, one per reserve
  // denom in canonical order).
  string fee_pct = 5
      [ deprecated = true, (cosmos_proto.scalar) = "cosmos.Dec" ];
  // Required: minimum collateral ratio per reserve denom (exactly two,
  // canonical order). Each amount is a LegacyDec string (> 1).
  repeated cosmos.base.v1beta1.DecCoin min_collateral_ratio = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];
  // Deprecated: maximum leverage ratio per reserve denom; ignored by server.
  // Kept for backward-compatible client requests.
  repeated cosmos.base.v1beta1.DecCoin max_leverage_ratio = 7 [
    deprecated = true,
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];
  // Annual interest rates per reserve denom (APR >= 0).
  // Input may include 0, 1, or 2 entries; keeper normalizes to exactly two
  // entries in canonical pool order.
  repeated cosmos.base.v1beta1.DecCoin interest_rate = 8 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (amino.dont_omitempty) = true
  ];
  // Required: maximum borrow capacity per reserve denom as DecCoins (exactly
  // two, canonical order). Each amount is a LegacyDec in [0,1).
  repeated cosmos.base.v1beta1.DecCoin max_borrow_percent = 9 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (amino.dont_omitempty) = true
  ];
  // Required: collateral ratio liquidation threshold per reserve denom
  // (exactly two, canonical order; each amount is a LegacyDec string > 1)
  repeated cosmos.base.v1beta1.DecCoin liquidation_threshold = 10 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];
  // Per-denom swap fee rates (amounts in [0,1)). Allow 0, 1, or 2 entries;
  // keeper normalizes to exactly two entries in canonical pool order.
  // Replaces deprecated fee_pct field 5.
  repeated cosmos.base.v1beta1.DecCoin fee_rate = 11 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (amino.dont_omitempty) = true
  ];
  // Optional: per-denom directional price-impact bounds keyed by the sold
  // denom. When omitted, defaults to 1 for both pool denoms (unbounded). When
  // provided, must contain exactly two entries in canonical pool order with
  // amounts satisfying 0 < x <= 1; x == 1 disables the bound for that denom.
  repeated cosmos.base.v1beta1.DecCoin bound_percent = 12 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (amino.dont_omitempty) = true
  ];
}
/*
 * Empty response. See EventPoolCreated for emitted details.
 */
message MsgCreatePoolResponse {
  // Newly created pool id.
  uint64 pool_id = 1;
}

/*
 * MsgUpdatePoolConfig
 */
message MsgUpdatePoolConfig {
  option (cosmos.msg.v1.signer) = "signer";
  // Signer address; must be the majority owner of pool shares.
  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Target pool id to update.
  uint64 pool_id = 2;
  // Deprecated: fee_pct is the legacy pool swap fee percentage (cosmos.Dec
  // string in [0,1)). Use fee_rate field 11 instead. Migration logic should
  // read this and convert to fee_rate format (two DecCoins, one per reserve
  // denom in canonical order).
  string fee_pct = 3
      [ deprecated = true, (cosmos_proto.scalar) = "cosmos.Dec" ];
  reserved 4, 5;
  reserved "min_price", "max_price";
  // Leverage configuration (per-denom)
  // Required: minimum collateral ratio per reserve denom (exactly two,
  // canonical order; > 1)
  repeated cosmos.base.v1beta1.DecCoin min_collateral_ratio = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];
  // Deprecated: maximum leverage ratio per reserve denom; ignored by server.
  // Kept for backward-compatible client requests.
  repeated cosmos.base.v1beta1.DecCoin max_leverage_ratio = 7 [
    deprecated = true,
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];
  // Required: annual interest rates per reserve denom (APR >= 0).
  // Input may include 0, 1, or 2 entries; keeper normalizes to exactly two in
  // canonical pool order.
  repeated cosmos.base.v1beta1.DecCoin interest_rate = 8 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (amino.dont_omitempty) = true
  ];
  // Optional: maximum borrow capacity per reserve denom (exactly two,
  // canonical order). Amounts in [0,1).
  repeated cosmos.base.v1beta1.DecCoin max_borrow_percent = 9 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (amino.dont_omitempty) = true
  ];
  // Required: collateral ratio liquidation threshold per reserve denom
  // (exactly two, canonical order; each amount is a LegacyDec string > 1)
  repeated cosmos.base.v1beta1.DecCoin liquidation_threshold = 10 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];
  // Per-denom swap fee rates (amounts in [0,1)). Allow 0, 1, or 2 entries;
  // keeper normalizes to exactly two entries in canonical pool order.
  // Replaces deprecated fee_pct field 3.
  repeated cosmos.base.v1beta1.DecCoin fee_rate = 11 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (amino.dont_omitempty) = true
  ];
  // Optional: directional price-impact bounds keyed by the sold denom. When
  // provided, must contain exactly two entries in canonical pool order. Amounts
  // must satisfy 0 < x <= 1; x == 1 disables the bound for that denom. Omit the
  // field to leave bounds unchanged.
  repeated cosmos.base.v1beta1.DecCoin bound_percent = 12 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins",
    (amino.dont_omitempty) = true
  ];
}
/*
 * Empty response. See EventPoolUpdate for emitted details.
 */
message MsgUpdatePoolConfigResponse {}

/**
 * Add liquidity (owner-only).
 *
 * Behavior:
 * - Loads pool; validates signer majority ownership.
 * - Escrows full provided amounts first, then refunds unused surplus.
 * - Computes shares as floor(min(add1/R1, add2/R2) × totalShares).
 * - Updates pool reserves with used amounts.
 * - Mints computed shares via nameservice and transfers to signer.
 * - Persists pool with updated reserves/timestamp; emits events; asserts AMM
 *   and module invariants.
 *
 * Validation:
 * - Pool must exist and have exactly two positive reserves.
 * - Signer must be valid address and hold majority of pool shares.
 * - Amounts must contain exactly two positive coins matching pool denoms in
 *   canonical order.
 *
 * Emits:
 * - EventPoolUpdate (after persisting pool state)
 * - EventPoolLiquidityAdded (on successful add)
 */
/*
 * MsgAddLiquidity
 */
message MsgAddLiquidity {
  option (cosmos.msg.v1.signer) = "signer";
  // Account adding liquidity; must be majority owner of pool shares.
  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Target pool id.
  uint64 pool_id = 2;
  // Reserved: was amount1/amount2 (fields 3-4) in old schema
  reserved 3, 4;
  reserved "amount1", "amount2";
  // Amounts to add: exactly two positive coins matching the pool denoms.
  // Canonicalized to pool denom order. Full amounts are escrowed; surplus is
  // refunded (band mode: to match ΔL; non-concentrated: to match minted
  // shares). For unbalanced adds, full amounts are added without refunds.
  repeated cosmos.base.v1beta1.Coin amounts = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // If true, add amounts directly without proportional adjustments or refunds.
  // Price may shift outside band (rejected if so); shares minted based on
  // proportional contribution.
  bool unbalanced = 6;
}
/*
 * Empty response. See EventPoolLiquidityAdded for emitted details.
 */
message MsgAddLiquidityResponse {
  // Shares minted to signer (sdk.Int string).
  string shares = 1;
}

/**
 * Remove liquidity from a pool by burning shares and returning underlying
 * reserves.
 *
 * Behavior:
 * - Supports full exit (burning all shares, deletes pool, returns all reserves)
 *   and partial exit (burns subset, returns proportional reserves, pool
 * remains).
 * - Full exit: when shares = total_supply, deletes pool, pays out full
 * reserves.
 * - Partial exit: computes pro-rata payout using DecCoins math, ensures
 * reserves don't go to zero (requires full exit for last liquidity).
 * - Burns shares from signer, sends proportional reserves from module to
 * signer.
 * - For partial exits: updates pool reserves, persists pool; asserts AMM
 * invariants.
 *
 * Validation:
 * - Pool must exist.
 * - Shares must be positive integer string.
 * - Signer must hold at least shares amount.
 * - Partial exits cannot deplete any reserve to zero.
 *
 * Emits:
 * - EventPoolLiquidityRemoved with pool_id and shares
 *
 * Returns:
 * - coins returned to the caller in the amount field.
 */
message MsgRemoveLiquidity {
  option (cosmos.msg.v1.signer) = "signer";
  // Account burning shares; must hold at least this amount.
  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Target pool id.
  uint64 pool_id = 2;
  // Shares to burn (sdk.Int string). Must be > 0; equals total supply to fully
  // exit (pool is deleted).
  string shares = 3;
}

message MsgRemoveLiquidityResponse {
  // Coins returned to the caller proportional to the burned shares.
  repeated cosmos.base.v1beta1.Coin amount = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
}

/**
 * PoolSwap executes one or more exact-in or exact-out pool swap legs with a
 * single end-of-tx settlement. Applies output-side fees per leg and enforces
 * aggregate max_input caps and min_output guarantees.
 *
 * Behavior:
 * - Per-leg execution: for each leg, validates the pool/denoms and computes
 *   the out amount using concentrated-liquidity band math (when configured) or
 *   constant-product math, applies output-side fee based on the output denom,
 *   and updates pool reserves.
 * - Aggregate constraints: after all legs, enforces per-denom debit caps
 *   (max_input) and minimum outputs (min_output), then performs a single bank
 *   move between trader and module for the net debits/credits.
 * - Invariants and recording: asserts AMM and module invariants and records a
 *   single Trade containing all operations.
 *
 * Validation:
 * - legs must be non-empty; each leg must specify exactly one of swap_in or
 *   swap_out with a positive amount.
 * - Pool must exist and have exactly two reserves; input/output denoms must be
 *   present in the pool.
 * - Concentrated-liquidity: resulting price must remain within [min_price,
 *   max_price]; exact-out must not exceed band capacity.
 * - Constant-product: swaps must not deplete any reserve; exact-out must not
 *   exceed capacity.
 * - Aggregate: required debits must not exceed max_input caps; final credits
 *   must satisfy min_output per denom.
 *
 * Emits:
 * - EventPoolSwap per executed leg (with pool_id, trade_id, operation_index)
 *   via recordTradeWithOperations
 * - EventTradeRecorded once after all legs are recorded
 *
 * Returns:
 * - amount_out: total coins credited to the trader across all legs.
 */
message MsgPoolSwap {
  option (cosmos.msg.v1.signer) = "trader";
  // Account initiating the swap; debited/credited on net settlement.
  string trader = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // End-of-tx debit caps per denom (vector cap). Missing denom implies 0.
  // Applied after aggregating all legs; tx fails if any denom's required debit
  // exceeds its cap.
  repeated cosmos.base.v1beta1.Coin max_input = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // Arbitrary set of swap legs; order does not need to be contiguous by denom.
  // Output-side fee is applied per leg based on the output denom.
  repeated SwapLeg legs = 3 [ (gogoproto.nullable) = false ];
  // Final minimum outputs required per denom after aggregation.
  repeated cosmos.base.v1beta1.Coin min_output = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
}
message SwapLeg {
  uint64 pool_id = 1;
  // Exactly one of swap_in (exact-in) or swap_out (exact-out) must be set.
  // Use message-level min_output for rate constraints across legs.
  cosmos.base.v1beta1.Coin swap_in = 2 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin swap_out = 3 [ (gogoproto.nullable) = false ];
}
message MsgPoolSwapResponse {
  // Total coins credited to the trader after aggregation across all legs.
  repeated cosmos.base.v1beta1.Coin amount_out = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
}

// TradeOperation allows mixing pool swap legs, orderbook takes, and auction
// redemptions. When stored in Trade.operations, sent/received fields are
// populated with execution results. When used in MsgMakeTrade.operations,
// sent/received are empty (populated during execution).
message TradeOperation {
  oneof op {
    SwapLeg swap = 1 [ (amino.oneof_name) = "swap" ];
    TakeItem take = 2 [ (amino.oneof_name) = "take" ];
    AuctionRedeem auction = 3 [ (amino.oneof_name) = "auction" ];
  }
  // Execution results (populated when recording Trade):
  cosmos.base.v1beta1.Coin sent = 10 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin received = 11 [ (gogoproto.nullable) = false ];
}

// AuctionRedeem operation for recording auction redemption in Trade history
message AuctionRedeem { uint64 auction_id = 1; }

/**
 * MakeTrade combines AMM pool swaps and orderbook takes into a single
 * transaction.
 *
 * Behavior:
 * - Processes SwapLeg (AMM pool swaps) and TakeItem (orderbook takes)
 * operations in order.
 * - Aggregates all inputs/outputs across operations, then performs
 * orderbook-style netting.
 * - Trader credits offset maker wants; deficits covered from trader base
 * balance.
 * - PFAND released to trader when offers close, applied pre-netting.
 * - Enforces per-denom debit caps (max_input) and minimum outputs (min_output)
 * after netting.
 * - Executes final settlement via multisend; all operations succeed or
 * transaction fails.
 * - Enables circular trade dependencies through self-netting: trader
 * debit/credit pairs by denom are netted out, allowing complex arbitrage
 * chains where intermediate results cancel (e.g., A→B→C→A becomes net B+C
 * profit).
 *
 * Validation:
 * - Trader address must be valid.
 * - Operations must be non-empty.
 * - Note length capped by module params.
 * - Swap operations: pool must exist, denoms match pool, no duplicate pool_ids.
 * - Take operations: offer must exist and be open, no duplicate offer_ids.
 * - Auction operations currently rejected.
 *
 * State updates:
 * - AMM pools: reserves updated, fees accrued, trade counters incremented.
 * - Offers: remaining units/wants/haves updated; closed when fully taken.
 * - Trade recorded with all operations, indexed by trader/pool/offer/auction.
 *
 * Emits:
 * - EventPfandReleased for each closed offer (amount, offer_id, trade_id)
 * - EventPoolSwap for each swap (pool_id, trade_id, operation_index)
 * - EventOfferTaken for each take (offer_id, trade_id, units_taken)
 * - EventTradeRecorded summary (trade_id, trader, num_operations, note)
 *
 * Returns:
 * - trade_id and final net trader_inputs/outputs after
 * netting/coverage/self-net.
 */
message MsgMakeTrade {
  option (cosmos.msg.v1.signer) = "trader";
  // Account executing the trade operations; all operations execute as this
  // trader.
  string trader = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // End-of-tx debit caps per denom for the trader; zero means no debits allowed
  // for that denom.
  repeated cosmos.base.v1beta1.Coin max_input = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // Mixed operations processed in-order; must contain at least one operation.
  repeated TradeOperation operations = 3 [ (gogoproto.nullable) = false ];
  // Final trader minimum outputs per denom after aggregation and netting.
  repeated cosmos.base.v1beta1.Coin min_output = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // Optional note attached to the trade record.
  string note = 5;
}

message MsgMakeTradeResponse {
  reserved 1;
  reserved "amount_out";
  // Unique ID of the recorded trade containing all operations.
  uint64 trade_id = 2;
  // Final net debits from trader by denom after netting, coverage, and
  // self-netting.
  repeated cosmos.base.v1beta1.Coin trader_inputs = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // Final net credits to trader by denom after netting, coverage, and
  // self-netting.
  repeated cosmos.base.v1beta1.Coin trader_outputs = 4 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
}

/**
 * MakeOffer creates an orderbook offer. ESCROW: base "have" is escrowed.
 * LIQUID: lock PFAND; settlement draws from maker balance at take. Units are
 * derived via GCD for partial fills.
 *
 * Behavior:
 * - Validates maker address, have/want coins (different denoms, positive
 * amounts).
 * - For ESCROW mode: escrows base have from maker to module.
 * - For LIQUID mode: locks PFAND from maker to module (if configured).
 * - Computes GCD of have/want amounts to establish unit_have/unit_want ratios.
 * - Creates offer with remaining_units = GCD, status = open.
 * - Persists offer and indexes it for queries.
 *
 * Validation:
 * - Maker address must be valid.
 * - Have/want denoms must be valid and different.
 * - Have/want amounts must be positive.
 * - Maker must hold sufficient have amount (for escrow check).
 * - For LIQUID mode: maker must hold sufficient PFAND if configured.
 *
 * Emits:
 * - EventOfferCreated with offer_id
 * - EventPfandLocked with amount, offer_id (if PFAND locked)
 *
 * Returns:
 * - offer_id of the newly created offer.
 */
message MsgMakeOffer {
  option (cosmos.msg.v1.signer) = "maker";
  string maker = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  cosmos.base.v1beta1.Coin have = 2 [ (gogoproto.nullable) = false ];
  cosmos.base.v1beta1.Coin want = 3 [ (gogoproto.nullable) = false ];
  // settlement_mode determines whether base have is escrowed (ESCROW) or
  // PFAND is locked and settlement occurs from maker balance at take (LIQUID).
  // Maker must currently hold at least the full `have` amount.
  SettlementMode settlement_mode = 4;
}
message MsgMakeOfferResponse { uint64 offer_id = 1; }

/**
 * TakeOffer executes one or more orderbook takes with netting and settlement.
 *
 * Behavior:
 * - Processes multiple take operations in a single transaction with aggregated
 * settlement.
 * - For each take: validates offer exists and is open, parses take_units
 * (defaults to remaining), computes exchange amounts (required_want =
 * take_units × unit_want, deliver_have = take_units × unit_have), aggregates
 * outputs by address, updates offer state (closes when fully taken), records
 * operations.
 * - Post-processing: computes maker wants and taker credits, nets taker credits
 * against maker wants, covers deficits from taker base balance (uses module
 * backing for remaining solid deficits).
 * - Settlement: executes batch coin movements via wsMoveCoins for all
 * participants.
 * - PFAND release: when offers close, locked PFAND flows from module to taker.
 * - Trade recording: creates single Trade with all operations, indexed by
 * trader/offer.
 *
 * Validation:
 * - Taker address must be valid.
 * - Trades list must be non-empty.
 * - Each offer must exist and be in open status.
 * - Take_units must be valid integer string (positive, ≤ remaining); empty
 * defaults to remaining.
 * - For LIQUID settlement: maker must have sufficient balance for deliver_have.
 * - Module must have sufficient backing for any uncovered solid deficits.
 *
 * Emits:
 * - EventOfferTaken for each take (offer_id, trade_id, units_taken)
 * - EventTradeRecorded for the batch (trade_id, trader, num_operations)
 * - EventPfandReleased for each closed offer (amount, offer_id, trade_id)
 *
 * Returns:
 * - aggregated sent/received totals across all executed takes.
 */
message MsgTakeOffer {
  option (cosmos.msg.v1.signer) = "taker";
  // Account executing the takes; all takes execute as this trader.
  string taker = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // List of take operations to execute; must contain at least one item.
  repeated TakeItem trades = 2 [ (gogoproto.nullable) = false ];
}
message TakeItem {
  // ID of the offer to take from; offer must exist and be in open status.
  uint64 offer_id = 1;
  // Units to take (sdk.Int string). If empty, take full remaining. Must be
  // positive and ≤ remaining.
  string take_units = 2;
}
message MsgTakeOfferResponse {

  // Total coins the taker sent across executed trades (usually want denom).
  repeated cosmos.base.v1beta1.Coin sent = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
  // Total coins the taker received across executed trades (usually have denom).
  repeated cosmos.base.v1beta1.Coin received = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins",
    (amino.dont_omitempty) = true,
    (amino.encoding) = "legacy_coins"
  ];
}

/**
 * CancelOffer cancels an open offer, refunding escrowed assets to the maker and
 * releasing PFAND to the authorized closer (maker or eligible third party).
 *
 * Behavior:
 * - Eligibility: maker may always cancel; for liquid-mode offers, third party
 *   may cancel if maker's balance of the have-denom drops below one unit_have
 *   (enables recovery when maker becomes insolvent).
 * - State updates: sets offer status to cancelled, persists the offer, and
 *   reindexes it for queries.
 * - Refunds: for escrow-settlement offers, sends remaining have coins from
 *   module to maker; sends any locked PFAND from module to closer.
 * - Reindexing: updates reverse indexes (owner, status) via helper.
 *
 * Validation:
 * - Offer must exist and be in open status.
 * - Closer address must be valid.
 * - Closer must be eligible (maker or authorized third party).
 * - For third-party cancellation, unit_have_int must be valid and maker balance
 *   must be insufficient.
 *
 * Emits:
 * - EventOfferCancelled with offer_id
 * - EventPfandReleased with amount, offer_id, trade_id=0 if PFAND was locked
 *
 * Returns:
 * - MsgCancelOfferResponse (empty).
 */
message MsgCancelOffer {
  option (cosmos.msg.v1.signer) = "closer";
  // Account requesting cancellation; must be eligible (maker or authorized
  // third party).
  string closer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // ID of the offer to cancel; offer must exist and be in open status.
  uint64 offer_id = 2;
}
message MsgCancelOfferResponse {}

/**
 * OpenAuction escrows the sell coin from the seller and mints an NFT under a
 * class keyed by `bid_denom`. Class policy (always_listed, valuation
 * fee/period, bid timeout, minimum bid percent increase, allowed denoms) is
 * set from module params. The NFT is sent to the seller and the auction record
 * with reverse indexes is persisted.
 *
 * Emits: EventAuctionCreated on success
 */
message MsgOpenAuction {
  option (cosmos.msg.v1.signer) = "seller";
  // Account opening the auction (receives the minted NFT).
  string seller = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Quote denom for bids; must be a valid denom and differ from sell.denom.
  string bid_denom = 2;
  // Sell coin to escrow from seller → module; amount must be > 0.
  cosmos.base.v1beta1.Coin sell = 3 [ (gogoproto.nullable) = false ];
}
message MsgOpenAuctionResponse { uint64 auction_id = 1; }

/**
 * RedeemAuction lets the current NFT owner redeem the auction escrow
 * when no bid is active.
 *
 * Behavior:
 * - Sends the escrowed sell coins from the module to the caller.
 * - Burns the NFT and deletes the auction record and reverse indexes.
 * - If owner != original seller and a positive valuation exists in `bid_denom`,
 *   a Trade is recorded and its id is included in EventAuctionRedeemed.
 *
 * Validation:
 * - Auction must exist.
 * - `caller` must equal the current NFT owner.
 * - No current bidder may exist.
 * - Module escrow must contain at least the sell amount.
 *
 * Emits: EventAuctionRedeemed (trade_id = 0 when seller redeems without trade)
 */
message MsgRedeemAuction {
  option (cosmos.msg.v1.signer) = "caller";
  // Account redeeming; must be the current NFT owner.
  string caller = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Auction to redeem.
  uint64 auction_id = 2;
}
/**
 * Empty response. See EventAuctionRedeemed for emitted details.
 */
message MsgRedeemAuctionResponse {}

// UpdateParams is the Msg/UpdateParams request type.
/**
 * UpdateParams updates module parameters.
 *
 * Behavior:
 * - Authority-only: verifies msg.Authority matches the module's configured
 * authority.
 * - Parameter validation: validates all parameter constraints (pfand amounts,
 * time durations, percentage bounds, block delays).
 * - State update: persists validated parameters to the module's parameter
 * store.
 *
 * Validation:
 * - Authority must match the module's configured authority address.
 * - Parameters must pass Params.Validate() which checks:
 *   - PfandPerOffer denom set when amount > 0
 *   - ValuationPeriod > 0
 *   - BidTimeout > 0
 *   - ValuationFeePct in [0,1) if set
 *   - MinimumBidPercentIncrease in [0,1) if set
 *   - BlockDelayBeforeClose > 0
 *   - BlockDelayBeforeLiquidation > 0
 *
 * Returns:
 * - MsgUpdateParamsResponse (empty) on success.
 */
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  // Authority address that must match the module's configured authority.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // New parameter values to set; must pass validation.
  Params params = 2 [ (gogoproto.nullable) = false ];
}
message MsgUpdateParamsResponse {}
// ═════════════════════════════════
// Leverage Messages
// ═════════════════════════════════

/**
 *  v creates a leveraged position by borrowing against collateral.
 *
 * Behavior:
 * - Validates pool (exactly 2 denoms), collateral/borrow amounts and denoms.
 * - Computes collateral ratio CR = collateral_value / debt_value in borrow
 *   units, accounting for current pool price.
 * - Validates CR >= pool.min_collateral_ratio[borrow_denom] (> 1).
 * - Validates leverage <= pool.max_leverage_ratio[borrow_denom] (> 1).
 * - Reduces pool reserves by borrow amount, updates total_borrowed.
 * - Moves borrowed amount to borrow vault, executes swap (borrowed → held).
 * - Escrows collateral to whaleswap module after swap.
 * - Creates position with interest rate and min_collateral_ratio snapshots.
 * - Held denom is the pool denom not matching borrow denom.
 *
 * Validation:
 * - Pool must exist with exactly 2 denoms.
 * - Collateral/borrow amounts must be positive.
 * - Collateral/borrow denoms must match pool denoms.
 * - Collateral ratio must meet pool min_collateral_ratio for borrow denom.
 * - Leverage must not exceed pool max_leverage_ratio for borrow denom.
 * - Borrow amount must not exceed pool borrow cap (max_borrow_percent).
 * - Swap must produce positive held output.
 *
 * Emits:
 * - EventLeveragePositionOpened with position_id, user, pool_id,
 *   collateral_denom, collateral_amount, borrowed_denom, borrowed_amount,
 *   entry_price_held_per_borrow, collateral_ratio.
 *
 * Returns:
 * - position_id and held coin in the response.
 */
message MsgOpenPosition {
  option (cosmos.msg.v1.signer) = "trader";
  // Account opening the leveraged position; collateral escrowed from this
  // address.
  string trader = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Target two-asset pool providing price reference and borrow caps.
  uint64 pool_id = 2;
  // Coin to escrow as security; must be positive and one of the pool denoms.
  cosmos.base.v1beta1.Coin collateral = 3 [ (gogoproto.nullable) = false ];
  // Liability coin; must be positive and one of the pool denoms. Interest
  // accrues on this amount.
  cosmos.base.v1beta1.Coin borrow = 4 [ (gogoproto.nullable) = false ];
  // Optional note for the position.
  string note = 5;
}

message MsgOpenPositionResponse {
  // Unique identifier for the newly created leveraged position.
  uint64 position_id = 1;
  // Amount of held asset received from the AMM swap (borrow denom → held
  // denom).
  cosmos.base.v1beta1.Coin held = 2 [ (gogoproto.nullable) = false ];
}

/**
 * ClosePosition closes a synthetic leveraged position.
 *
 * Behavior:
 * - Swaps held to the borrowed denom via the borrow vault, computes accrued
 *   interest at the snapshotted rate, restores pool reserves by full
 *   repayment, returns remaining collateral and any profit to the user,
 *   updates pool accounting, and deletes the position.
 *
 * Emits: EventLeveragePositionClosed on success
 */
message MsgClosePosition {
  option (cosmos.msg.v1.signer) = "user";
  // Account closing the position; must be the position owner.
  string user = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Target position id to close.
  uint64 position_id = 2;
  // Optional note carried into internal trade logs (opaque to the module).
  string note = 3;
}

message MsgClosePositionResponse {
  // Accrued interest paid (borrowed denom).
  cosmos.base.v1beta1.Coin interest_paid = 1 [ (gogoproto.nullable) = false ];
  // Principal repaid (borrowed denom).
  cosmos.base.v1beta1.Coin principal_paid = 2 [ (gogoproto.nullable) = false ];
  // Profit returned to the user (borrowed denom).
  cosmos.base.v1beta1.Coin profit = 3 [ (gogoproto.nullable) = false ];
}

/**
 * AddCollateral deposits additional collateral to a leveraged position.
 *
 * Behavior:
 * - Validates position ownership and pool/denom consistency.
 * - Transfers additional collateral from the user to the module.
 * - Adds the collateral to the position's existing collateral amount.
 * - Clears any pending liquidation markers on the position.
 * - Persists the updated position and computes the new collateral ratio.
 *
 * Validation:
 * - Position must exist and be owned by `user`.
 * - Pool ID must match the position's pool.
 * - Collateral denom must match the position's existing collateral denom.
 * - Collateral amount must be positive.
 *
 * Emits:
 * - EventLeverageCollateralAdded with position_id, user, pool_id,
 *   collateral_added, new_collateral, new_collateral_ratio.
 *
 * Returns:
 * - new_collateral and new_collateral_ratio in the response.
 */
message MsgAddCollateral {
  option (cosmos.msg.v1.signer) = "user";
  // Account adding collateral; must be the position owner.
  string user = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Target pool id; must match the position's pool.
  uint64 pool_id = 2;
  // Target position id to add collateral to.
  uint64 position_id = 3;
  // Additional collateral coin to deposit; denom must match position's
  // existing collateral; amount must be positive.
  cosmos.base.v1beta1.Coin collateral = 4 [ (gogoproto.nullable) = false ];
}

message MsgAddCollateralResponse {
  // Updated collateral coin after addition.
  cosmos.base.v1beta1.Coin new_collateral = 1 [ (gogoproto.nullable) = false ];
  // New collateral ratio after addition (LegacyDec string).
  string new_collateral_ratio = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

/**
 * Cover a leveraged position.
 *
 * Behavior:
 * - If payment >= principal + accrued interest:
 *   - Enforces the close block delay,
 *   - Unwinds held → borrowed via a pool swap from the borrow vault,
 *   - Repays principal + interest to pool reserves and accounting,
 *   - Returns full collateral, refunds any unused portion of the user's
 * payment, and sends any unwind PnL as profit,
 *   - Deletes the position (auto-close).
 * - If payment < total repayment:
 *   - Pays all accrued interest and applies the remainder to reduce principal,
 *   - Resets borrow_time and clears liquidation markers,
 *   - Updates pool accounting and returns the new collateral ratio at the
 *     current price; the position remains open.
 *
 * Validation:
 * - Position must exist and be owned by `user`.
 * - `payment` must be positive and its denom must equal the borrowed denom.
 * - Position must have a two-entry interest_rate snapshot; payment must fully
 *   cover accrued interest.
 * - Auto-close path respects the close block delay and requires the unwind swap
 *   to produce borrowed output.
 *
 * Emits:
 * - EventLeveragePositionCovered (always; closed = true when fully repaid)
 * - EventLeveragePositionClosed (auto-close only)
 *
 * Returns:
 * - Auto-close: interest_paid, principal_paid = full borrowed, new_borrowed =
 * 0, new_collateral_ratio = 0, closed = true, refunded = unused payment, profit
 * = unwind PnL.
 * - Partial cover: interest_paid, principal_paid, new_borrowed (remaining),
 *   new_collateral_ratio at current price, closed = false, refunded = 0, profit
 * = 0.
 */
message MsgCoverPosition {
  // Account covering the position; must be the position owner.
  option (cosmos.msg.v1.signer) = "user";
  string user = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Target position id to cover.
  uint64 position_id = 2;
  // Payment coin to cover the position. Must be positive and its denom must
  // equal the borrowed denom.
  cosmos.base.v1beta1.Coin payment = 3 [ (gogoproto.nullable) = false ];
  // Optional note to use in trade logs.
  string note = 4;
}

message MsgCoverPositionResponse {
  // Accrued interest paid (borrowed denom).
  cosmos.base.v1beta1.Coin interest_paid = 1 [ (gogoproto.nullable) = false ];
  // Principal amount paid (borrowed denom).
  cosmos.base.v1beta1.Coin principal_paid = 2 [ (gogoproto.nullable) = false ];
  // New borrowed principal after payment (0 if closed).
  cosmos.base.v1beta1.Coin new_borrowed = 3 [ (gogoproto.nullable) = false ];
  // New collateral ratio at current price; "0" when closed.
  string new_collateral_ratio = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // True if the position was fully repaid and deleted.
  bool closed = 5;
  // Unused portion of the user's payment returned (auto-close path).
  cosmos.base.v1beta1.Coin refunded = 6 [ (gogoproto.nullable) = false ];
  // Swap PnL from unwinding held → borrowed during auto-close.
  cosmos.base.v1beta1.Coin profit = 7 [ (gogoproto.nullable) = false ];
}

/**
 * Initialize liquidation of a leveraged position.
 *
 * Behavior:
 * - Permissionless trigger: any `initializer` may call this.
 * - Accrues interest at the snapshotted APR since borrow_time and computes
 *   the collateral ratio CR = collateral / (principal + interest).
 * - Compares CR against the pool's per-denom liquidation_threshold for the
 *   borrowed denom (> 1 required).
 * - On CR < threshold, records liquidation markers (status and current block
 *   height) and persists the updated position.
 *
 * Validation:
 * - Position must exist; pool must exist.
 * - Position must have a two-entry interest_rate snapshot.
 * - Pool must have a two-entry liquidation_threshold; borrowed denom entry must
 *   be > 1.
 * - Position must be liquidatable at evaluation time (CR < threshold).
 *
 * Emits:
 * - EventLeverageLiquidationInitialized with position_id, user, pool_id,
 *   collateral_ratio, liquidation_threshold, block_height.
 *
 * Returns:
 * - collateral_ratio and liquidation_threshold in the response.
 */
message MsgInitializeLiquidation {
  option (cosmos.msg.v1.signer) = "initializer";
  // Account initializing liquidation; permissionless (any account).
  string initializer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Position owner address; should match the position's user.
  string user = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Pool id; should match the position's pool.
  uint64 pool_id = 3;
  // Target position id to initialize.
  uint64 position_id = 4;
}

message MsgInitializeLiquidationResponse {
  // Collateral ratio at evaluation time (LegacyDec string).
  string collateral_ratio = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // Liquidation threshold used for comparison (LegacyDec string).
  string liquidation_threshold = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

/**
 * Finalize liquidation of a leveraged position.
 *
 * Behavior:
 * - Permissionless trigger: any `liquidator` may call this for any position
 * with initialized liquidation.
 * - Accrues interest on borrowed amount using the snapshotted per-denom APR and
 *   elapsed seconds since borrow_time.
 * - Computes final repayment as principal + accrued interest.
 * - Liquidator sends repayment to module and receives all collateral.
 * - Updates pool accounting (repayment to reserves, subtract borrowed, accrue
 *   interest earned); pool does not incur losses in liquidation.
 * - Deletes the position and clears all state.
 *
 * Semantics:
 * - Block delay: requires at least 1 block to have passed since initialization.
 * - Settlement: full collateral goes to liquidator regardless of repayment
 * amount; pool absorbs any shortfall as loss.
 * - Pool loss: when repayment > collateral, the difference is recorded as pool
 *   loss (may be 0).
 *
 * Validation:
 * - Position must exist with LIQUIDATION_STATUS_INITIALIZED.
 * - Block delay must have passed (current_height > initialized_height).
 * - Position must have a two-entry interest_rate snapshot.
 * - Pool must exist.
 *
 * Emits:
 * - EventLeverageLiquidationFinalized with position_id, user, liquidator,
 * pool_id, collateral_received, repayment_amount, accrued_interest.
 *
 * Returns:
 * - collateral_received, repayment_amount, accrued_interest.
 */
message MsgFinalizeLiquidation {
  option (cosmos.msg.v1.signer) = "liquidator";
  // Account finalizing liquidation; permissionless (any account).
  string liquidator = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Position owner address; should match the position's user.
  string user = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Pool id; should match the position's pool.
  uint64 pool_id = 3;
  // Target position id to finalize liquidation for.
  uint64 position_id = 4;
}

message MsgFinalizeLiquidationResponse {
  // Collateral coin received by the liquidator.
  cosmos.base.v1beta1.Coin collateral_received = 1
      [ (gogoproto.nullable) = false ];
  // Total repayment amount sent by the liquidator (principal + interest).
  cosmos.base.v1beta1.Coin repayment_amount = 2
      [ (gogoproto.nullable) = false ];
  // Accrued interest portion of the repayment.
  cosmos.base.v1beta1.Coin accrued_interest = 3
      [ (gogoproto.nullable) = false ];
}
