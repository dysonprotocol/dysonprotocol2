syntax = "proto3";
package dysonprotocol.crontask.v1;

option go_package = "dysonprotocol.com/x/crontask/types";

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";

// Subscription defines an event-triggered action to execute a script
message Subscription {
  // unique id
  uint64 subscription_id = 1;

  // creator account that owns this subscription
  string creator = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // GJSON filter to match events across the normalized block event array
  string filter = 3;

  // target script address
  string script_address = 4 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // function name to invoke
  string function = 5;

  // positional args as JSON list string
  string args = 6;

  // keyword args as JSON dict string
  string kwargs = 7;

  // gas limit for the created crontask
  uint64 task_gas_limit = 8;

  // fee for the created crontask; also charged at subscription creation/renewal
  cosmos.base.v1beta1.Coin task_gas_fee = 9 [ (gogoproto.nullable) = false ];

  // status: enabled|disabled|error|expired
  string status = 10;

  // status message
  string status_message = 11;

  // Subscription expiry timestamp (unix seconds)
  int64 expiry_timestamp = 12;

  // total number of triggers so far (field name per requirement)
  uint64 trigger_count = 13;

  // Overrides for created crontasks
  int64 task_scheduled_timestamp = 14;
  int64 task_expiry_timestamp = 15;
  cosmos.base.v1beta1.DecCoin task_gas_price = 16
      [ (gogoproto.nullable) = false ];
}
